<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¡Feliz Año Nuevo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<style>
  :root {
    --rg-fondo: #070816;
    --rg-texto: #f8f5ee;
    --rg-acento: #e8c77d;
    --rg-acento-luz: #f7e2ad;
    --rg-intro-fondo: radial-gradient(circle at 50% 35%, #171a3a, #04050d);
  }

  body {
    background: radial-gradient(ellipse at 50% 110%, #1b1f4a 0%, #0b0c22 50%, #04050d 100%);
    min-height: 100svh;
  }

  /* Cielo estrellado estático */
  .estrellas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff8, transparent),
      radial-gradient(1px 1px at 32% 42%, #fff6, transparent),
      radial-gradient(1.5px 1.5px at 58% 12%, #fff9, transparent),
      radial-gradient(1px 1px at 74% 32%, #fff6, transparent),
      radial-gradient(1.5px 1.5px at 88% 8%, #fff8, transparent),
      radial-gradient(1px 1px at 20% 70%, #fff5, transparent),
      radial-gradient(1px 1px at 82% 62%, #fff5, transparent),
      radial-gradient(1px 1px at 46% 84%, #fff4, transparent);
  }

  #fuegos {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .escena {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px 48px;
    position: relative;
    z-index: 2;
  }

  .subtitulo {
    font-family: var(--rg-fuente-acento);
    font-size: 2.2rem;
    color: var(--rg-acento);
    margin: 0 0 4px;
    line-height: 1;
  }

  h1 {
    font-family: var(--rg-fuente-titulo);
    font-size: clamp(2.3rem, 8.5vw, 3.6rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    line-height: 1.15;
  }

  .anio {
    font-family: var(--rg-fuente-titulo);
    font-size: clamp(5rem, 26vw, 9rem);
    font-weight: 600;
    line-height: 1;
    margin: 18px 0 24px;
    background: linear-gradient(180deg, #fff6dc 10%, #e8c77d 55%, #a87f32 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-variant-numeric: tabular-nums;
    min-height: 1em;
  }

  .anio.latido { animation: latido 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }

  @keyframes latido {
    0% { transform: scale(1.6); opacity: 0; filter: blur(8px); }
    40% { opacity: 1; filter: none; }
    100% { transform: scale(1); }
  }

  .instruccion {
    margin: 0;
    color: var(--rg-texto-suave);
    font-size: 0.92rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: 1.5em;
  }

  .boton-cuenta {
    margin-top: 28px;
    font-family: var(--rg-fuente);
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #0b0c22;
    background: linear-gradient(135deg, var(--rg-acento-luz), var(--rg-acento));
    border: 0;
    border-radius: 999px;
    padding: 15px 30px;
    cursor: pointer;
    box-shadow: 0 10px 28px -8px rgba(232, 199, 125, 0.6);
    transition: transform 0.3s cubic-bezier(0.3, 1.4, 0.5, 1);
  }

  .boton-cuenta:hover { transform: translateY(-2px) scale(1.03); }
  .boton-cuenta[hidden] { display: none; }

  .contenido {
    position: relative;
    z-index: 2;
    max-width: 620px;
    margin: 0 auto;
    padding: 0 20px 90px;
  }

  .carta {
    background: rgba(18, 20, 46, 0.72);
    border: 1px solid rgba(232, 199, 125, 0.35);
    border-radius: 16px;
    padding: 38px 30px;
    backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px -15px rgba(0, 0, 0, 0.7);
  }

  .carta p {
    white-space: pre-line;
    line-height: 1.75;
    font-size: 1.08rem;
    margin: 0;
    min-height: 3em;
  }

  .contenido h2 {
    font-family: var(--rg-fuente-titulo);
    font-size: 2.1rem;
    text-align: center;
    color: var(--rg-acento-luz);
    margin: 54px 0 12px;
  }
</style>
</head>
<body data-icono="🥂">
  <div class="estrellas" aria-hidden="true"></div>
  <canvas id="fuegos" aria-hidden="true"></canvas>

  <section class="escena">
    <p class="subtitulo" id="subtitulo">Cuenta regresiva</p>
    <h1 id="titulo">Un nuevo año está por llegar</h1>
    <div class="anio" id="anio" aria-live="polite"></div>
    <p class="instruccion" id="instruccion">Cuando estés listo, empieza la cuenta</p>
    <button class="boton-cuenta" id="iniciar" type="button">Iniciar cuenta regresiva</button>
  </section>

  <main class="contenido" id="contenido" hidden>
    <div class="carta rg-oculto" id="carta">
      <p id="mensaje"></p>
      <div class="rg-firma">— <span data-campo="de"></span></div>
    </div>
    <h2 class="rg-oculto" id="tituloFotos">Lo mejor de este año</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = /*__DATOS__*/{}/*__FIN__*/;</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, flotar, datos } = Regalo;

  // Año que llega: el indicado en el pedido o, desde julio, el siguiente.
  const hoy = new Date();
  const ANIO = parseInt(datos.anio, 10) || (hoy.getMonth() >= 6 ? hoy.getFullYear() + 1 : hoy.getFullYear());

  /* Fuegos artificiales en canvas */
  const lienzo = $('#fuegos');
  const ctx = lienzo.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const ajustar = () => { lienzo.width = innerWidth * dpr; lienzo.height = innerHeight * dpr; };
  ajustar();
  addEventListener('resize', ajustar);

  const paleta = ['#f7e2ad', '#e8c77d', '#ffffff', '#ff8fa3', '#9fc3ff', '#c9a7ff'];
  let chispas = [], animando = false;

  function estallar(x, y) {
    const color = paleta[(Math.random() * paleta.length) | 0];
    const n = 70 + ((Math.random() * 30) | 0);
    for (let i = 0; i < n; i++) {
      const ang = (Math.PI * 2 * i) / n;
      const vel = (2 + Math.random() * 3.2) * dpr;
      chispas.push({ x, y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, vida: 1, color });
    }
    if (!animando) { animando = true; requestAnimationFrame(dibujar); }
  }

  function dibujar() {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.fillRect(0, 0, lienzo.width, lienzo.height);
    ctx.globalCompositeOperation = 'lighter';
    chispas.forEach(c => {
      c.x += c.vx; c.y += c.vy;
      c.vx *= 0.975; c.vy = c.vy * 0.975 + 0.05 * dpr;
      c.vida -= 0.013;
      ctx.globalAlpha = Math.max(0, c.vida);
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.arc(c.x, c.y, 1.8 * dpr, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    chispas = chispas.filter(c => c.vida > 0);
    if (chispas.length) requestAnimationFrame(dibujar);
    else { animando = false; ctx.clearRect(0, 0, lienzo.width, lienzo.height); }
  }

  const alAzar = () => estallar((0.15 + Math.random() * 0.7) * lienzo.width, (0.12 + Math.random() * 0.4) * lienzo.height);

  let celebrado = false;
  $('#iniciar').addEventListener('click', async () => {
    $('#iniciar').hidden = true;
    $('#instruccion').textContent = '';
    const anio = $('#anio');
    for (const n of [5, 4, 3, 2, 1]) {
      anio.textContent = n;
      anio.classList.remove('latido');
      void anio.offsetWidth;
      anio.classList.add('latido');
      if (navigator.vibrate) navigator.vibrate(20);
      await espera(1000);
    }
    celebrar();
  });

  async function celebrar() {
    celebrado = true;
    const anio = $('#anio');
    anio.textContent = ANIO;
    anio.classList.remove('latido');
    void anio.offsetWidth;
    anio.classList.add('latido');
    $('#subtitulo').textContent = '¡Feliz Año Nuevo!';
    $('#titulo').textContent = datos.titulo || (datos.para ? `Por un año increíble, ${datos.para}` : 'Por un año increíble');
    $('#instruccion').textContent = 'Toca el cielo para lanzar más fuegos ✦';
    for (let i = 0; i < 7; i++) setTimeout(alAzar, i * 320);
    flotar(['✦', '✧', '·'], { cada: 800, duracion: 10000 });
    await espera(2600);
    $('#contenido').hidden = false;
    $('#carta').classList.add('rg-visible');
    $('#carta').scrollIntoView({ behavior: 'smooth', block: 'center' });
    await escribir($('#mensaje'), datos.mensaje || 'Que este nuevo año llegue con salud, sueños cumplidos y mucho amor.\nBrindo por todo lo que viene.');
    if (datos.fotos && datos.fotos.length) {
      $('#tituloFotos').classList.add('rg-visible');
      $('#galeria').classList.add('rg-visible');
    }
  }

  // Después de la cuenta, cada toque lanza un fuego donde tocaste.
  addEventListener('pointerdown', e => {
    if (!celebrado || e.target.closest('.carta, .rg-galeria, button, iframe')) return;
    estallar(e.clientX * dpr, e.clientY * dpr);
  });

  Regalo.iniciar({});
  galeria($('#galeria'));
  if (!datos.fotos || !datos.fotos.length) $('#tituloFotos').remove();
</script>
</body>
</html>
