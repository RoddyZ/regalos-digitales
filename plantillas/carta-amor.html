<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Una carta para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<link rel="icon" href="../assets/icono.svg" type="image/svg+xml">
<style>
  :root {
    --rg-fondo: #f8e4da;
    --rg-acento: #e0475b;
    --rg-acento-2: #f7c9c0;
    --rg-acento-tinta: #c22e44;
    --rg-boton-texto: #fffdf8;
    --rg-caja: #f7c9c0;
    --rg-cinta: #e0475b;
    --rg-washi: rgba(224, 71, 91, 0.55);
    --sobre: #f7c9c0;
    --solapa: #f3b6ab;
  }

  body {
    min-height: 100svh;
    background-image: repeating-linear-gradient(135deg, transparent 0 22px, rgba(224, 71, 91, 0.05) 22px 44px);
  }

  .rg-titulo { margin-inline: auto; }

  .sobre {
    position: relative;
    width: min(86vw, 330px);
    aspect-ratio: 3 / 2;
    margin: 84px auto 10px;
    cursor: pointer;
    perspective: 900px;
    filter: drop-shadow(6px 7px 0 var(--rg-sombra));
    animation: esperar 3s ease-in-out infinite;
  }
  .sobre svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  @keyframes esperar {
    0%, 75%, 100% { transform: rotate(0); }
    80% { transform: rotate(-2.5deg); }
    88% { transform: rotate(2deg); }
  }

  .sobre .hoja {
    position: absolute;
    left: 7%;
    right: 7%;
    top: 6%;
    height: 84%;
    z-index: 2;
    background: var(--rg-papel);
    border: var(--rg-borde);
    border-radius: 6px;
    background-image: repeating-linear-gradient(transparent 0 17px, #f0dcd3 17px 19px);
    background-position: 0 14px;
    transition: transform 0.9s cubic-bezier(0.3, 1.3, 0.5, 1) 0.45s;
  }

  .sobre .frente { z-index: 3; pointer-events: none; }

  .sobre .solapa {
    position: absolute;
    inset: 0;
    z-index: 4;
    transform-origin: 50% 2%;
    transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s 0.35s;
  }

  .sobre .sello {
    position: absolute;
    left: 50%;
    top: 58%;
    z-index: 5;
    width: 64px;
    translate: -50% -50%;
    transition: opacity 0.3s, transform 0.3s;
    animation: latir 1.6s ease-in-out infinite;
  }
  .sobre .sello svg { position: static; width: 100%; height: auto; }

  @keyframes latir { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } }

  .sobre.abierto { cursor: default; animation: none; }
  .sobre.abierto .solapa { transform: rotateX(180deg); z-index: 1; }
  .sobre.abierto .sello { opacity: 0; transform: scale(1.6); pointer-events: none; }
  .sobre.abierto .hoja { transform: translateY(-42%); }

  .contador {
    margin-top: 34px;
    display: inline-block;
    background: var(--rg-papel);
    border: var(--rg-borde);
    border-radius: 16px;
    padding: 10px 22px 12px;
    box-shadow: 0 4px 0 var(--rg-sombra);
    font-weight: 800;
    font-size: 0.95rem;
  }
  .contador b {
    display: block;
    font-family: var(--rg-fuente-titulo);
    font-size: 2.3rem;
    font-weight: 700;
    color: var(--rg-acento-tinta);
    line-height: 1.05;
  }

  /* La carta: papel rayado y letra escrita a mano */
  .rg-carta {
    background-color: var(--rg-papel);
    background-image: repeating-linear-gradient(transparent 0 37px, #f0dcd3 37px 39px);
    background-position: 0 30px;
    padding-top: 30px;
  }
  .rg-carta .saludo {
    min-height: 0;
    font-family: var(--rg-fuente-mano);
    font-weight: 700;
    font-size: 2.2rem;
    line-height: 39px;
    color: var(--rg-acento-tinta);
    margin: 0 0 0;
  }
  .rg-carta p#mensaje {
    font-family: var(--rg-fuente-mano);
    font-weight: 500;
    font-size: 1.65rem;
    line-height: 39px;
  }
  .rg-firma { font-size: 2.2rem; }
</style>
</head>
<body>
  <section class="rg-escena">
    <p class="rg-etiqueta">Para <span data-campo="para">ti</span></p>
    <h1 class="rg-titulo" data-campo="titulo">Tengo algo que decirte</h1>
    <p class="rg-ayuda" id="pista">Toca el corazón para abrir la carta</p>

    <div class="sobre" id="sobre" role="button" aria-label="Abrir la carta">
      <svg viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
        <rect x="2" y="2" width="296" height="196" rx="10" fill="var(--solapa)" stroke="var(--rg-tinta)" stroke-width="3"/>
      </svg>
      <div class="hoja"></div>
      <svg class="frente" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
        <path d="M2 62L150 132 298 62V188a10 10 0 0 1-10 10H12A10 10 0 0 1 2 188z" fill="var(--sobre)" stroke="var(--rg-tinta)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M6 194L118 116M294 194L182 116" stroke="var(--rg-tinta)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="solapa">
        <svg viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
          <path d="M2 12A10 10 0 0 1 12 2H288a10 10 0 0 1 10 10L150 124z" fill="var(--solapa)" stroke="var(--rg-tinta)" stroke-width="3" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="sello" aria-hidden="true">
        <svg viewBox="0 0 64 60">
          <path d="M32 54C14 43 5 32 5 21A13 13 0 0 1 32 15a13 13 0 0 1 27 6c0 11-9 22-27 33z" fill="#e0475b" stroke="var(--rg-tinta)" stroke-width="3" stroke-linejoin="round"/>
          <path d="M32 44C21 37 15 30 15 23a7 7 0 0 1 17-3 7 7 0 0 1 17 3c0 7-6 14-17 21z" fill="none" stroke="#fff" stroke-width="2" opacity=".55"/>
        </svg>
      </div>
    </div>

    <div class="contador rg-oculto" id="contador"></div>
  </section>

  <main class="rg-contenido" id="contenido" hidden>
    <article class="rg-carta rg-oculto" id="carta">
      <p class="saludo">Para <span data-campo="para">ti</span>:</p>
      <p id="mensaje"></p>
      <div class="rg-firma">Con todo mi amor, <span data-campo="de"></span></div>
    </article>
    <h2 class="rg-subtitulo rg-oculto" id="tituloFotos">Nuestra historia</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = /*__DATOS__*/{}/*__FIN__*/;</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, flotar, diasDesde, final, datos } = Regalo;

  if (datos.saludo) $('.saludo').textContent = datos.saludo;

  const dias = diasDesde(datos.desde);
  if (dias !== null && dias >= 0) {
    $('#contador').innerHTML = `${Regalo.esc(datos.textoContador || 'Juntos desde hace')}<b>${dias.toLocaleString('es')} días</b>`;
  } else $('#contador').remove();

  let abierto = false;
  $('#sobre').addEventListener('click', async () => {
    if (abierto) return;
    abierto = true;
    if (navigator.vibrate) navigator.vibrate(20);
    $('#sobre').classList.add('abierto');
    $('#pista').style.opacity = '0';
    flotar([['corazon', '#e0475b'], ['corazon', '#f7c9c0'], ['corazon', '#fffdf8']], { cada: 650 });
    await espera(1500);
    $('#contador') && $('#contador').classList.add('rg-visible');
    $('#contenido').hidden = false;
    await espera(700);
    $('#carta').classList.add('rg-visible');
    $('#carta').scrollIntoView({ behavior: 'smooth', block: 'start' });
    await escribir($('#mensaje'), datos.mensaje || 'Gracias por estar en mi vida cada día.');
    final();
  });

  Regalo.iniciar({});
  galeria($('#galeria'));
</script>
</body>
</html>
