<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Flores amarillas para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<link rel="icon" href="../assets/icono.svg" type="image/svg+xml">
<style>
  :root {
    --rg-fondo: #fdf1d3;
    --rg-acento: #ffc23d;
    --rg-acento-2: #6fae5b;
    --rg-acento-tinta: #b35c00;
    --rg-caja: #ffc23d;
    --rg-cinta: #6fae5b;
    --rg-washi: rgba(111, 174, 91, 0.75);
    --tallo: #4f8f4a;
    --petalo: #ffc23d;
    --centro: #7a4a1f;
  }

  .escena { position: relative; min-height: 100svh; overflow: hidden; }

  .sol {
    position: absolute;
    top: 7svh;
    right: 7%;
    width: 92px;
    z-index: 1;
    opacity: 0;
    transform: translateY(30px) scale(0.6);
    transition: opacity 0.8s ease, transform 1s cubic-bezier(0.3, 1.4, 0.5, 1);
  }
  .sol.rg-visible { opacity: 1; transform: none; }
  .sol .rayos { transform-origin: 50px 50px; animation: girar 24s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  .nube {
    position: absolute;
    width: 110px;
    z-index: 1;
    animation: pasar linear infinite;
  }
  @keyframes pasar {
    from { transform: translateX(-140px); }
    to { transform: translateX(calc(100vw + 40px)); }
  }

  .cabecera {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 22svh 22px 0;
  }

  #jardin {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: 62svh;
    z-index: 2;
    overflow: visible;
  }

  .tallo-borde { fill: none; stroke: var(--rg-tinta); stroke-width: 7.5; stroke-linecap: round; }
  .tallo { fill: none; stroke: var(--tallo); stroke-width: 4; stroke-linecap: round; }
  .hoja {
    fill: var(--rg-acento-2);
    stroke: var(--rg-tinta);
    stroke-width: 2.4;
    stroke-linejoin: round;
    transform: scale(0);
    transform-box: fill-box;
    transition: transform 0.9s cubic-bezier(0.3, 1.4, 0.5, 1);
  }
  .hoja.izq { transform-origin: 100% 50%; }
  .hoja.der { transform-origin: 0% 50%; }

  .flor {
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0) rotate(-90deg);
    transition: transform 1.1s cubic-bezier(0.3, 1.5, 0.5, 1);
  }
  .flor ellipse { fill: var(--petalo); stroke: var(--rg-tinta); stroke-width: 2.2; }
  .flor .centro { fill: var(--centro); stroke: var(--rg-tinta); stroke-width: 2.4; }
  .flor .semilla { fill: #a8692e; }

  .crecida .hoja { transform: scale(1); }
  .crecida .flor { transform: scale(1) rotate(0); }
  .flor.abierta { animation: mecer 5s ease-in-out infinite; }
  @keyframes mecer { 50% { transform: rotate(7deg); } }

  .loma { fill: #a7cf7f; stroke: var(--rg-tinta); stroke-width: 3; }

  .bajar {
    position: absolute;
    bottom: 18px;
    left: 50%;
    z-index: 4;
    translate: -50% 0;
    background: var(--rg-papel);
    border: var(--rg-borde);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.95rem;
    font-weight: 800;
    box-shadow: 0 4px 0 var(--rg-sombra);
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transition: opacity 0.6s;
  }
  .bajar.rg-visible { opacity: 1; animation: rebote 2s ease-in-out infinite; }
  @keyframes rebote { 50% { transform: translateY(6px); } }

  .rg-contenido { padding-top: 56px; }
</style>
</head>
<body>
  <section class="escena">
    <svg class="sol" id="sol" viewBox="0 0 100 100" aria-hidden="true">
      <g class="rayos" stroke="var(--rg-tinta)" stroke-width="3" stroke-linecap="round">
        <path d="M50 4v12M50 84v12M4 50h12M84 50h12M17 17l9 9M74 74l9 9M17 83l9-9M74 26l9-9"/>
      </g>
      <circle cx="50" cy="50" r="24" fill="#ffd166" stroke="var(--rg-tinta)" stroke-width="3"/>
      <path d="M40 48q3-4 6 0M54 48q3-4 6 0" fill="none" stroke="var(--rg-tinta)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M45 56q5 5 10 0" fill="none" stroke="var(--rg-tinta)" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="37" cy="55" r="3.5" fill="#ff9a7a" opacity=".7"/><circle cx="63" cy="55" r="3.5" fill="#ff9a7a" opacity=".7"/>
    </svg>
    <svg class="nube" style="top:13svh; animation-duration:46s; animation-delay:-18s" viewBox="0 0 110 50" aria-hidden="true">
      <path d="M22 44a14 14 0 0 1 2-28 20 20 0 0 1 38-4 15 15 0 0 1 26 10 11 11 0 0 1 0 22z" fill="#fffdf8" stroke="var(--rg-tinta)" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <svg class="nube" style="top:30svh; width:80px; animation-duration:60s; animation-delay:-41s" viewBox="0 0 110 50" aria-hidden="true">
      <path d="M22 44a14 14 0 0 1 2-28 20 20 0 0 1 38-4 15 15 0 0 1 26 10 11 11 0 0 1 0 22z" fill="#fffdf8" stroke="var(--rg-tinta)" stroke-width="3" stroke-linejoin="round"/>
    </svg>

    <header class="cabecera rg-oculto" id="cabecera">
      <p class="rg-etiqueta">Para <span data-campo="para">ti</span></p>
      <h1 class="rg-titulo" data-campo="titulo" style="margin-inline:auto">Flores amarillas para ti</h1>
    </header>

    <svg id="jardin" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>

    <div class="bajar" id="bajar">
      Desliza, hay más
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </div>
  </section>

  <main class="rg-contenido">
    <div class="rg-carta rg-oculto" id="carta">
      <p id="mensaje"></p>
      <div class="rg-firma">— <span data-campo="de"></span></div>
    </div>
    <h2 class="rg-subtitulo rg-oculto" id="tituloFotos">Nuestros momentos</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = /*__DATOS__*/{}/*__FIN__*/;</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, flotar, final, datos } = Regalo;

  const NS = 'http://www.w3.org/2000/svg';
  const svg = $('#jardin');
  const el = (tag, attrs, padre) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    padre && padre.appendChild(n);
    return n;
  };

  // Girasoles: tallo con contorno, dos hojas y la flor que se abre girando.
  const flores = [];
  [[46, 300], [104, 230], [160, 330], [212, 260], [262, 350], [318, 240], [372, 300], [132, 170], [290, 175]].forEach(([x, alto], i) => {
    const tope = 500 - alto;
    const curva = x + (i % 2 ? 22 : -22);
    const d = `M${x} 520 Q${curva} ${520 - alto / 2} ${x} ${tope}`;
    const g = el('g', {}, svg);
    const borde = el('path', { class: 'tallo-borde', d }, g);
    const tallo = el('path', { class: 'tallo', d }, g);
    const hy = 520 - alto * 0.42;
    el('path', { class: 'hoja izq', d: `M${x - 2} ${hy} q-14 -16 -32 -10 q12 16 32 10z` }, g);
    el('path', { class: 'hoja der', d: `M${x + 2} ${hy + 26} q14 -16 32 -10 q-12 16 -32 10z` }, g);
    const flor = el('g', { class: 'flor' }, g);
    const r = 17 + (i % 3) * 4;
    for (let p = 0; p < 12; p++) {
      el('ellipse', { cx: x, cy: tope - r * 0.78, rx: r * 0.3, ry: r * 0.62, transform: `rotate(${p * 30} ${x} ${tope})` }, flor);
    }
    el('circle', { class: 'centro', cx: x, cy: tope, r: r * 0.5 }, flor);
    [[-0.2, -0.15], [0.18, -0.05], [-0.02, 0.2]].forEach(([dx, dy]) =>
      el('circle', { class: 'semilla', cx: x + dx * r, cy: tope + dy * r, r: 2 }, flor));
    [borde, tallo].forEach(t => {
      const largo = t.getTotalLength();
      t.style.strokeDasharray = largo;
      t.style.strokeDashoffset = largo;
      t.style.transition = 'stroke-dashoffset 1.8s ease-out';
    });
    flores.push({ g, trazos: [borde, tallo], flor, orden: Math.random() });
  });
  el('path', { class: 'loma', d: 'M-20 490 Q90 458 200 478 T420 470 V540 H-20z' }, svg);

  const mostrar = e => e && e.classList.add('rg-visible');

  Regalo.iniciar({
    async alAbrir() {
      mostrar($('#sol'));
      await espera(300);
      mostrar($('#cabecera'));
      flores.sort((a, b) => a.orden - b.orden).forEach((f, i) => setTimeout(() => {
        f.trazos.forEach(t => t.style.strokeDashoffset = 0);
        setTimeout(() => {
          f.g.classList.add('crecida');
          setTimeout(() => f.flor.classList.add('abierta'), 1200);
        }, 1500);
      }, i * 230));
      await espera(3800);
      mostrar($('#bajar'));
      flotar([['flor', '#ffc23d'], ['flor', '#fffdf8'], ['corazon', '#ff8a8a']], { cada: 1500, tamano: [16, 28] });

      const obs = new IntersectionObserver(async ([e]) => {
        if (!e.isIntersecting) return;
        obs.disconnect();
        mostrar($('#carta'));
        await escribir($('#mensaje'), datos.mensaje || 'Porque hay personas que hacen florecer todo a su alrededor.');
        final();
      }, { threshold: 0.25 });
      obs.observe($('#carta'));
    }
  });

  galeria($('#galeria'));
</script>
</body>
</html>
