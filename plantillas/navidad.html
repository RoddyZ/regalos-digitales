<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¡Feliz Navidad!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<style>
  :root {
    --rg-fondo: #0a1410;
    --rg-texto: #f8f5ee;
    --rg-acento: #e6c071;
    --rg-acento-luz: #f6dea2;
    --rg-rojo: #d9485b;
    --rg-intro-fondo: radial-gradient(circle at 50% 35%, #163024, #060d0a);
  }

  body {
    background: radial-gradient(ellipse at 50% 20%, #173828 0%, #0c1d15 55%, #050a07 100%);
    min-height: 100svh;
  }

  .nieve {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }

  .nieve span {
    position: absolute;
    top: -20px;
    color: #fff;
    opacity: 0.8;
    animation: caer-nieve linear forwards;
  }

  @keyframes caer-nieve {
    to { transform: translate(var(--deriva), 110svh); opacity: 0.2; }
  }

  .escena {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px 48px;
    position: relative;
    z-index: 2;
  }

  .subtitulo {
    font-family: var(--rg-fuente-acento);
    font-size: 2.2rem;
    color: var(--rg-acento);
    margin: 0 0 4px;
    line-height: 1;
  }

  h1 {
    font-family: var(--rg-fuente-titulo);
    font-size: clamp(2.3rem, 8.5vw, 3.6rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
    line-height: 1.15;
  }

  .instruccion {
    margin: 0;
    color: var(--rg-texto-suave);
    font-size: 0.92rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: 1.5em;
  }

  .arbol {
    width: min(270px, 72vw);
    margin: 26px auto 18px;
    filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.55));
  }

  .arbol svg { width: 100%; height: auto; display: block; overflow: visible; }

  .esfera { cursor: pointer; }
  .esfera .bola { fill: #263a2f; stroke: rgba(255, 255, 255, 0.18); stroke-width: 1.2; transition: fill 0.4s ease; }
  .esfera.encendida { cursor: default; }
  .esfera.encendida .bola {
    fill: var(--c);
    filter: url(#brillo);
    animation: titilar 1.8s ease-in-out infinite alternate;
    animation-delay: var(--d);
  }

  @keyframes titilar {
    to { opacity: 0.65; }
  }

  .estrella { fill: #3a4a3e; transition: fill 0.6s ease; transform-origin: 120px 30px; }
  .estrella.encendida {
    fill: #f6dea2;
    filter: url(#brillo);
    animation: estrella 2.4s ease-in-out infinite;
  }

  @keyframes estrella {
    50% { transform: scale(1.12) rotate(8deg); }
  }

  .contenido {
    position: relative;
    z-index: 2;
    max-width: 620px;
    margin: 0 auto;
    padding: 0 20px 90px;
  }

  .carta {
    background: #fdfaf4;
    color: #2a2420;
    border-radius: 16px;
    padding: 40px 30px 34px;
    box-shadow: 0 24px 55px -14px rgba(0, 0, 0, 0.7);
    border-top: 6px solid var(--rg-rojo);
    position: relative;
  }

  .carta::before {
    content: '❄';
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--rg-rojo);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 18px;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  }

  .carta p {
    white-space: pre-line;
    line-height: 1.75;
    font-size: 1.08rem;
    margin: 0;
    min-height: 3em;
  }

  .carta .rg-firma { color: #a3303f; }

  .contenido h2 {
    font-family: var(--rg-fuente-titulo);
    font-size: 2.1rem;
    text-align: center;
    color: var(--rg-acento-luz);
    margin: 54px 0 12px;
  }
</style>
</head>
<body data-icono="🎄">
  <div class="nieve" id="nieve" aria-hidden="true"></div>

  <section class="escena">
    <p class="subtitulo">Noche de paz</p>
    <h1 id="titulo">Un árbol por encender</h1>
    <p class="instruccion" id="instruccion">Toca las esferas para encender el árbol</p>

    <div class="arbol">
      <svg viewBox="0 0 240 290" id="arbol" aria-label="Árbol de Navidad">
        <defs>
          <filter id="brillo" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <linearGradient id="hoja" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2a7a4e"/>
            <stop offset="1" stop-color="#14452c"/>
          </linearGradient>
        </defs>
        <rect x="106" y="256" width="28" height="30" rx="3" fill="#5b3b22"/>
        <polygon points="120,150 8,262 232,262" fill="url(#hoja)"/>
        <polygon points="120,92 24,206 216,206" fill="url(#hoja)"/>
        <polygon points="120,40 40,142 200,142" fill="url(#hoja)"/>
        <path d="M62 124 Q120 146 182 118 M48 188 Q120 214 196 180 M30 246 Q120 272 214 238" fill="none" stroke="#e6c071" stroke-width="1.6" stroke-dasharray="3 5" opacity="0.7"/>
        <polygon class="estrella" id="estrella" points="120,12 126,26 141,27 129,36 133,51 120,42 107,51 111,36 99,27 114,26"/>
      </svg>
    </div>
  </section>

  <main class="contenido" id="contenido" hidden>
    <div class="carta rg-oculto" id="carta">
      <p id="mensaje"></p>
      <div class="rg-firma">— <span data-campo="de"></span></div>
    </div>
    <h2 class="rg-oculto" id="tituloFotos">Recuerdos de este año</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = /*__DATOS__*/{}/*__FIN__*/;</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, confeti, flotar, datos } = Regalo;

  // Nieve suave de fondo
  const nieve = $('#nieve');
  function copo() {
    const s = document.createElement('span');
    s.textContent = Math.random() < 0.3 ? '❄' : '•';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = 6 + Math.random() * 10 + 'px';
    s.style.setProperty('--deriva', (Math.random() - 0.5) * 80 + 'px');
    s.style.animationDuration = 7 + Math.random() * 6 + 's';
    nieve.appendChild(s);
    setTimeout(() => s.remove(), 13000);
  }
  setInterval(copo, 280);

  // Esferas del árbol
  const posiciones = [[96, 118], [150, 126], [70, 182], [124, 172], [174, 190], [56, 240], [112, 236], [168, 246], [200, 236]];
  const colores = ['#d9485b', '#e6c071', '#7fb7e6', '#f2f2f2', '#d9485b', '#e6c071', '#c98be0', '#7fb7e6', '#f2f2f2'];
  const svg = $('#arbol');
  const NS = 'http://www.w3.org/2000/svg';
  posiciones.forEach(([x, y], i) => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'esfera');
    g.style.setProperty('--c', colores[i]);
    g.style.setProperty('--d', (i % 4) * 0.4 + 's');
    g.innerHTML = `<circle cx="${x}" cy="${y}" r="18" fill="transparent"/><circle class="bola" cx="${x}" cy="${y}" r="9"/>`;
    g.addEventListener('click', () => encender(g));
    svg.appendChild(g);
  });

  const total = posiciones.length;
  let encendidas = 0, celebrado = false;
  function encender(g) {
    if (g.classList.contains('encendida') || celebrado) return;
    g.classList.add('encendida');
    if (navigator.vibrate) navigator.vibrate(15);
    encendidas++;
    $('#instruccion').textContent = encendidas < total ? `${encendidas} de ${total} esferas encendidas` : '¡El árbol brilla! ✦';
    if (encendidas === total) celebrar();
  }

  async function celebrar() {
    celebrado = true;
    await espera(400);
    $('#estrella').classList.add('encendida');
    confeti({ duracion: 4500, colores: ['#e6c071', '#f6dea2', '#ffffff', '#d9485b', '#2a7a4e'] });
    flotar(['✦', '❄', '✧'], { cada: 700, duracion: 12000 });
    const nombre = datos.para ? `, ${datos.para}` : '';
    $('#titulo').textContent = datos.titulo || `¡Feliz Navidad${nombre}!`;
    await espera(1800);
    $('#contenido').hidden = false;
    $('#carta').classList.add('rg-visible');
    $('#carta').scrollIntoView({ behavior: 'smooth', block: 'center' });
    await escribir($('#mensaje'), datos.mensaje || 'Que esta Navidad te llene de paz, amor y momentos bonitos.\nGracias por ser parte de mi año.');
    if (datos.fotos && datos.fotos.length) {
      $('#tituloFotos').classList.add('rg-visible');
      $('#galeria').classList.add('rg-visible');
    }
  }

  Regalo.iniciar({});
  galeria($('#galeria'));
  if (!datos.fotos || !datos.fotos.length) $('#tituloFotos').remove();
</script>
</body>
</html>
