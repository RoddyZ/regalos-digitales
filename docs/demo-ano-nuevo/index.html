<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¡Feliz Año Nuevo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<link rel="icon" href="../assets/icono.svg" type="image/svg+xml">
<style>
  :root {
    --rg-fondo: #1d2b5e;
    --rg-texto: #fffdf8;
    --rg-texto-suave: rgba(255, 253, 248, 0.75);
    --rg-acento: #ffd166;
    --rg-acento-2: #ff6b8b;
    --rg-acento-tinta: #ff9fb5;
    --rg-sombra: #0f1838;
    --rg-caja: #ff6b8b;
    --rg-cinta: #ffd166;
    --rg-washi: rgba(255, 209, 102, 0.8);
  }

  body { min-height: 100svh; }

  .cielo { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .cielo span { position: absolute; animation: titilar 2.6s ease-in-out infinite; }
  .cielo svg { width: 100%; height: auto; display: block; }
  @keyframes titilar { 50% { transform: scale(0.6); opacity: 0.5; } }

  .cielo .luna { position: absolute; top: 5svh; left: 7%; width: 74px; animation: none; }

  #fuegos { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  .rg-titulo { margin-inline: auto; }

  .anio {
    font-family: var(--rg-fuente-titulo);
    font-variation-settings: 'SOFT' 100, 'WONK' 1;
    font-size: clamp(5rem, 28vw, 9rem);
    font-weight: 700;
    line-height: 1;
    margin: 10px 0 18px;
    color: var(--rg-acento);
    text-shadow: 6px 6px 0 var(--rg-acento-2);
    font-variant-numeric: tabular-nums;
    min-height: 1em;
  }
  .anio.latido { animation: latido 0.8s cubic-bezier(0.3, 1.5, 0.5, 1); }
  @keyframes latido { 0% { transform: scale(0.3) rotate(-12deg); opacity: 0; } 60% { opacity: 1; } }

  .rg-boton { margin-top: 26px; }

  .rg-carta .rg-firma { color: #d6336c; }
</style>
</head>
<body>
  <div class="cielo" id="cielo" aria-hidden="true">
    <span class="luna">
      <svg viewBox="0 0 80 80">
        <path d="M52 8a32 32 0 1 0 20 52A28 28 0 0 1 52 8z" fill="#ffe9a8" stroke="var(--rg-tinta)" stroke-width="3" stroke-linejoin="round"/>
        <path d="M24 42q4 4 8 0M38 48q4 4 8 0" fill="none" stroke="var(--rg-tinta)" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="26" cy="52" r="3.5" fill="#ffb3a6"/>
      </svg>
    </span>
  </div>
  <canvas id="fuegos" aria-hidden="true"></canvas>

  <section class="rg-escena">
    <p class="rg-etiqueta" id="etiqueta">Cuenta regresiva</p>
    <h1 class="rg-titulo" id="titulo">Un año nuevo está por llegar</h1>
    <div class="anio" id="anio" aria-live="polite"></div>
    <p class="rg-ayuda" id="instruccion">Cuando estés listo, empieza la cuenta</p>
    <button class="rg-boton" id="iniciar" type="button">Empezar la cuenta</button>
  </section>

  <main class="rg-contenido" id="contenido" hidden>
    <div class="rg-carta rg-oculto" id="carta">
      <p id="mensaje"></p>
      <div class="rg-firma">— <span data-campo="de"></span></div>
    </div>
    <h2 class="rg-subtitulo rg-oculto" id="tituloFotos">Lo mejor de este año</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = {"para":"Andrea","de":"Carlos","mensaje":"Gracias por hacer de este año el mejor de mi vida.\nQue el que viene llegue con salud, viajes y sueños cumplidos.\nBrindo por nosotros.","fotos":[{"src":"f1.webp"}]};</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, flotar, figura, final, datos } = Regalo;

  // Año que llega: el indicado en el pedido o, desde julio, el siguiente.
  const hoy = new Date();
  const ANIO = parseInt(datos.anio, 10) || (hoy.getMonth() >= 6 ? hoy.getFullYear() + 1 : hoy.getFullYear());

  // Estrellitas dibujadas en el cielo
  [[18, 22], [80, 9], [62, 30], [90, 40], [10, 62], [86, 72], [30, 84], [70, 90], [48, 6]].forEach(([x, y], i) => {
    const s = document.createElement('span');
    s.innerHTML = figura('estrella', i % 3 ? '#ffe9a8' : '#ff9fb5');
    Object.assign(s.style, { left: x + '%', top: y + '%', width: 10 + (i % 3) * 5 + 'px', animationDelay: i * 0.37 + 's' });
    $('#cielo').appendChild(s);
  });

  /* Fuegos artificiales en canvas, en colores planos */
  const lienzo = $('#fuegos');
  const ctx = lienzo.getContext('2d');
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const ajustar = () => { lienzo.width = innerWidth * dpr; lienzo.height = innerHeight * dpr; };
  ajustar();
  addEventListener('resize', ajustar);

  const paleta = ['#ffd166', '#ff6b8b', '#7ec4ff', '#fffdf8', '#9be3b0', '#c9a2ff'];
  let chispas = [], animando = false;

  function estallar(x, y) {
    const color = paleta[(Math.random() * paleta.length) | 0];
    const n = 42 + ((Math.random() * 16) | 0);
    for (let i = 0; i < n; i++) {
      const ang = (Math.PI * 2 * i) / n;
      const vel = (2.2 + Math.random() * 2.6) * dpr;
      chispas.push({ x, y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, vida: 1, color, t: (2.4 + Math.random() * 1.6) * dpr });
    }
    if (!animando) { animando = true; requestAnimationFrame(dibujar); }
  }

  function dibujar() {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.fillRect(0, 0, lienzo.width, lienzo.height);
    ctx.globalCompositeOperation = 'source-over';
    chispas.forEach(c => {
      c.x += c.vx; c.y += c.vy;
      c.vx *= 0.96; c.vy = c.vy * 0.96 + 0.06 * dpr;
      c.vida -= 0.014;
      ctx.globalAlpha = Math.max(0, Math.min(1, c.vida * 1.6));
      ctx.fillStyle = c.color;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.t, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    chispas = chispas.filter(c => c.vida > 0);
    if (chispas.length) requestAnimationFrame(dibujar);
    else { animando = false; ctx.clearRect(0, 0, lienzo.width, lienzo.height); }
  }

  const alAzar = () => estallar((0.15 + Math.random() * 0.7) * lienzo.width, (0.12 + Math.random() * 0.4) * lienzo.height);

  let celebrado = false;
  $('#iniciar').addEventListener('click', async () => {
    $('#iniciar').hidden = true;
    $('#instruccion').textContent = '';
    const anio = $('#anio');
    for (const n of [5, 4, 3, 2, 1]) {
      anio.textContent = n;
      anio.classList.remove('latido');
      void anio.offsetWidth;
      anio.classList.add('latido');
      if (navigator.vibrate) navigator.vibrate(20);
      await espera(1000);
    }
    celebrar();
  });

  async function celebrar() {
    celebrado = true;
    const anio = $('#anio');
    anio.textContent = ANIO;
    anio.classList.remove('latido');
    void anio.offsetWidth;
    anio.classList.add('latido');
    $('#etiqueta').textContent = '¡Feliz Año Nuevo!';
    $('#titulo').textContent = datos.titulo || (datos.para ? `Por un año increíble, ${datos.para}` : 'Por un año increíble');
    $('#instruccion').textContent = 'Toca el cielo para lanzar más fuegos';
    for (let i = 0; i < 7; i++) setTimeout(alAzar, i * 320);
    flotar([['estrella', '#ffd166'], ['circulo', '#ff6b8b']], { cada: 1000, duracion: 10000, tamano: [12, 22] });
    await espera(2600);
    $('#contenido').hidden = false;
    $('#carta').classList.add('rg-visible');
    $('#carta').scrollIntoView({ behavior: 'smooth', block: 'center' });
    await escribir($('#mensaje'), datos.mensaje || 'Que este nuevo año llegue con salud, sueños cumplidos y mucho amor.\nBrindo por todo lo que viene.');
    final();
  }

  // Después de la cuenta, cada toque lanza un fuego donde tocaste.
  addEventListener('pointerdown', e => {
    if (!celebrado || e.target.closest('.rg-carta, .rg-galeria, button, iframe, a')) return;
    estallar(e.clientX * dpr, e.clientY * dpr);
  });

  Regalo.iniciar({});
  galeria($('#galeria'));
</script>
</body>
</html>
