<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Atrapa los corazones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<link rel="icon" href="../assets/icono.svg" type="image/svg+xml">
<style>
  :root {
    --rg-fondo: #ffe3e8;
    --rg-acento: #ff5a6e;
    --rg-acento-2: #ffd166;
    --rg-acento-tinta: #d6334a;
    --rg-boton-texto: #fffdf8;
    --rg-caja: #ff5a6e;
    --rg-cinta: #ffd166;
    --rg-washi: rgba(255, 154, 173, 0.8);
  }

  body {
    min-height: 100svh;
    user-select: none;
    -webkit-user-select: none;
    background-image: radial-gradient(rgba(214, 51, 74, 0.16) 2px, transparent 2.5px);
    background-size: 26px 26px;
  }

  .hud {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    z-index: 25;
    max-width: 380px;
    margin: 0 auto;
    padding: 12px 16px 14px;
    text-align: center;
    background: var(--rg-papel);
    border: var(--rg-borde);
    border-radius: 18px;
    box-shadow: 0 5px 0 var(--rg-sombra);
    transition: opacity 0.5s ease, transform 0.5s ease;
  }
  .hud.fuera { opacity: 0; transform: translateY(-30px); }

  .hud p { margin: 0 0 9px; font-weight: 800; font-size: 1rem; }
  .hud p b { font-family: var(--rg-fuente-titulo); font-size: 1.25rem; color: var(--rg-acento-tinta); }

  .barra {
    height: 16px;
    border: var(--rg-borde);
    border-radius: 99px;
    background: #fff;
    overflow: hidden;
  }

  .barra i {
    display: block;
    height: 100%;
    width: 0;
    background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.35) 0 6px, transparent 6px 12px), var(--rg-acento);
    border-right: 2.5px solid var(--rg-tinta);
    transition: width 0.3s cubic-bezier(0.3, 1.4, 0.5, 1);
  }

  #juego { position: fixed; inset: 0; overflow: hidden; touch-action: manipulation; }

  .corazon {
    position: absolute;
    top: -80px;
    width: 58px;
    padding: 8px;
    cursor: pointer;
    animation: caer linear forwards;
  }
  .corazon svg { width: 100%; height: auto; display: block; overflow: visible; }
  .corazon.atrapado { animation: explotar 0.35s ease-out forwards !important; pointer-events: none; }

  @keyframes caer { to { transform: translateY(calc(100svh + 140px)) rotate(var(--giro)); } }
  @keyframes explotar { 40% { transform: scale(1.35); } to { transform: scale(0.2); opacity: 0; } }

  .mas {
    position: absolute;
    font-family: var(--rg-fuente-titulo);
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--rg-acento-tinta);
    pointer-events: none;
    translate: -50% -50%;
    animation: subir 0.8s ease-out forwards;
  }
  @keyframes subir { to { transform: translateY(-46px); opacity: 0; } }

  .final {
    position: relative;
    z-index: 30;
    text-align: center;
    padding-top: 12svh;
  }
  .final .rg-titulo { margin-inline: auto; margin-bottom: 34px; }
</style>
</head>
<body>
  <div class="hud" id="hud">
    <p id="textoHud">Atrapa <b id="meta">15</b> corazones para abrir tu mensaje</p>
    <div class="barra"><i id="progreso"></i></div>
  </div>

  <div id="juego"></div>

  <main class="rg-contenido final" id="final" hidden>
    <p class="rg-etiqueta">¡Sorpresa!</p>
    <h1 class="rg-titulo rg-oculto" id="titulo" data-campo="titulo">¡Me atrapaste!</h1>
    <div class="rg-carta rg-oculto" id="carta">
      <p id="mensaje"></p>
      <div class="rg-firma">— <span data-campo="de"></span></div>
    </div>
    <h2 class="rg-subtitulo rg-oculto" id="tituloFotos">Nuestros recuerdos</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = {"para":"Vale","de":"Tu novio","titulo":"¡Me atrapaste!","meta":12,"mensaje":"Así como atrapaste todos esos corazones, un día atrapaste el mío.\nFeliz aniversario, amor.","fotos":[{"src":"f1.webp"},{"src":"f2.webp"},{"src":"f3.webp"}]};</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, confeti, flotar, figura, final, datos } = Regalo;
  const META = Math.max(3, parseInt(datos.meta, 10) || 15);
  $('#meta').textContent = META;
  const juego = $('#juego');
  const colores = ['#ff5a6e', '#ff5a6e', '#ff9aad', '#fffdf8', '#ffd166'];
  let atrapados = 0, generador = null;

  function soltar() {
    const c = document.createElement('div');
    c.className = 'corazon';
    c.innerHTML = figura('corazon', colores[(Math.random() * colores.length) | 0]);
    c.style.left = 4 + Math.random() * 78 + 'vw';
    c.style.width = 50 + Math.random() * 22 + 'px';
    c.style.setProperty('--giro', (Math.random() - 0.5) * 50 + 'deg');
    c.style.animationDuration = Math.max(2.6, 5.2 - atrapados * 0.14) + Math.random() * 1.4 + 's';
    c.addEventListener('pointerdown', e => atrapar(c, e));
    c.addEventListener('animationend', () => c.classList.contains('atrapado') || c.remove());
    juego.appendChild(c);
  }

  function atrapar(c, e) {
    if (c.classList.contains('atrapado')) return;
    c.classList.add('atrapado');
    setTimeout(() => c.remove(), 350);

    const m = document.createElement('div');
    m.className = 'mas';
    m.textContent = '+1';
    m.style.left = e.clientX + 'px';
    m.style.top = e.clientY + 'px';
    juego.appendChild(m);
    setTimeout(() => m.remove(), 800);

    if (navigator.vibrate) navigator.vibrate(18);
    atrapados++;
    $('#progreso').style.width = Math.min(100, (atrapados / META) * 100) + '%';
    if (atrapados === META) ganar();
  }

  async function ganar() {
    clearInterval(generador);
    $('#textoHud').textContent = '¡Lo lograste!';
    confeti({ colores: ['#ff5a6e', '#ff9aad', '#ffd166', '#fffdf8'], duracion: 4200 });
    await espera(800);
    juego.querySelectorAll('.corazon').forEach(c => c.remove());
    $('#hud').classList.add('fuera');
    $('#final').hidden = false;
    flotar([['corazon', '#ff5a6e'], ['corazon', '#ff9aad'], ['corazon', '#fffdf8']], { cada: 900 });
    await espera(100);
    $('#titulo').classList.add('rg-visible');
    await espera(600);
    $('#carta').classList.add('rg-visible');
    await escribir($('#mensaje'), datos.mensaje || 'Así como atrapaste cada uno de esos corazones, atrapaste el mío.');
    final();
  }

  Regalo.iniciar({
    alAbrir() {
      soltar();
      generador = setInterval(soltar, 650);
    }
  });

  galeria($('#galeria'));
</script>
</body>
</html>
