<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¡Felicidades, graduado!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<style>
  :root {
    --rg-fondo: #0c1020;
    --rg-texto: #f7f4ec;
    --rg-acento: #e2bd6c;
    --rg-acento-luz: #f3d99c;
    --rg-intro-fondo: radial-gradient(circle at 50% 35%, #1a2140, #080b16);
  }

  body {
    background: radial-gradient(ellipse at 50% 0%, #1d2547 0%, #0e1226 55%, #070911 100%);
    min-height: 100svh;
  }

  /* Haces de luz de escenario */
  .reflectores {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      conic-gradient(from 200deg at 20% -10%, transparent 0deg, rgba(226, 189, 108, 0.08) 12deg, transparent 24deg),
      conic-gradient(from 140deg at 80% -10%, transparent 0deg, rgba(226, 189, 108, 0.08) 12deg, transparent 24deg);
  }

  .escena {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px 48px;
    position: relative;
    z-index: 2;
  }

  .subtitulo {
    font-family: var(--rg-fuente-acento);
    font-size: 2.2rem;
    color: var(--rg-acento);
    margin: 0 0 4px;
    line-height: 1;
  }

  h1 {
    font-family: var(--rg-fuente-titulo);
    font-size: clamp(2.3rem, 8.5vw, 3.6rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
    line-height: 1.15;
  }

  .carrera {
    margin: 0 0 6px;
    font-size: 0.95rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rg-acento-luz);
    min-height: 1.4em;
  }

  .instruccion {
    margin: 0;
    color: var(--rg-texto-suave);
    font-size: 0.92rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .birrete {
    width: 220px;
    margin: 46px auto 30px;
    cursor: pointer;
    border: 0;
    background: none;
    padding: 0;
    filter: drop-shadow(0 22px 30px rgba(0, 0, 0, 0.55));
    animation: flotar-birrete 3.2s ease-in-out infinite;
  }

  .birrete svg { width: 100%; height: auto; display: block; }

  .birrete .borla {
    transform-origin: 100px 55px;
    animation: balanceo 2.4s ease-in-out infinite;
  }

  .birrete.lanzado {
    animation: lanzar 1.6s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
    pointer-events: none;
  }

  @keyframes flotar-birrete {
    50% { transform: translateY(-10px) rotate(-2deg); }
  }

  @keyframes balanceo {
    50% { transform: rotate(6deg); }
  }

  @keyframes lanzar {
    0% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(20px) scale(0.95); }
    100% { transform: translateY(-120vh) rotate(720deg) scale(0.6); opacity: 0; }
  }

  .contenido {
    position: relative;
    z-index: 2;
    max-width: 620px;
    margin: 0 auto;
    padding: 0 20px 90px;
  }

  /* Diploma que se despliega */
  .diploma {
    position: relative;
    background: linear-gradient(180deg, #fbf6ea, #f2e9d4);
    color: #2a2518;
    border-radius: 6px;
    padding: 44px 32px 38px;
    box-shadow: 0 30px 60px -18px rgba(0, 0, 0, 0.7);
    outline: 1px solid rgba(226, 189, 108, 0.6);
    outline-offset: -12px;
    transform-origin: top center;
    transform: scaleY(0);
    opacity: 0;
    transition: transform 1.1s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease;
  }

  .diploma.abierto { transform: scaleY(1); opacity: 1; }

  .diploma::before, .diploma::after {
    content: '';
    position: absolute;
    left: -10px;
    right: -10px;
    height: 18px;
    border-radius: 9px;
    background: linear-gradient(180deg, #e8dcc0, #c9b68e);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
  }
  .diploma::before { top: -9px; }
  .diploma::after { bottom: -9px; }

  .diploma h2 {
    font-family: var(--rg-fuente-titulo);
    font-weight: 500;
    font-size: 1.05rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    text-align: center;
    color: #8a6a2b;
    margin: 0 0 22px;
  }

  .diploma p {
    white-space: pre-line;
    line-height: 1.75;
    font-size: 1.08rem;
    margin: 0;
    min-height: 3em;
  }

  .diploma .rg-firma { color: #7d2a35; }

  .sello {
    position: absolute;
    right: 22px;
    bottom: -26px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #f3d99c, #b98a35 80%);
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
    display: grid;
    place-items: center;
    font-size: 26px;
    z-index: 2;
  }

  .contenido > h2 {
    font-family: var(--rg-fuente-titulo);
    font-size: 2.1rem;
    text-align: center;
    color: var(--rg-acento-luz);
    margin: 64px 0 12px;
  }
</style>
</head>
<body data-icono="🎓">
  <div class="reflectores" aria-hidden="true"></div>

  <section class="escena">
    <p class="subtitulo">Lo lograste</p>
    <h1 id="titulo">Hoy celebramos tu esfuerzo</h1>
    <p class="carrera" id="carrera"></p>
    <button class="birrete" id="birrete" type="button" aria-label="Lanzar el birrete">
      <svg viewBox="0 0 200 150" aria-hidden="true">
        <path d="M52 70 v34 c0 16 96 16 96 0 v-34 l-48 18 z" fill="#151a2e"/>
        <path d="M52 70 v34 c0 16 96 16 96 0" fill="none" stroke="#2c3458" stroke-width="2"/>
        <polygon points="100,22 192,56 100,90 8,56" fill="#1d2440" stroke="#38416b" stroke-width="2"/>
        <polygon points="100,26 182,56 100,86 18,56" fill="none" stroke="#2a3152" stroke-width="1"/>
        <g class="borla">
          <path d="M100 56 Q140 58 160 66 L160 108" fill="none" stroke="#e2bd6c" stroke-width="3" stroke-linecap="round"/>
          <path d="M154 106 h12 l3 24 h-18 z" fill="#e2bd6c"/>
        </g>
        <circle cx="100" cy="56" r="5" fill="#f3d99c"/>
      </svg>
    </button>
    <p class="instruccion" id="instruccion">Toca el birrete para lanzarlo al cielo</p>
  </section>

  <main class="contenido" id="contenido" hidden>
    <div class="diploma" id="diploma">
      <h2>Con orgullo y admiración</h2>
      <p id="mensaje"></p>
      <div class="rg-firma">— <span data-campo="de"></span></div>
      <div class="sello" aria-hidden="true">✦</div>
    </div>
    <h2 class="rg-oculto" id="tituloFotos">Momentos del camino</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = {"para":"Daniela","de":"Tu familia","carrera":"Ingeniería en Software · Promoción 2026","mensaje":"Cada desvelo, cada examen y cada sacrificio te trajeron hasta aquí.\nHoy celebramos a la profesional que siempre supimos que serías.\nEstamos muy orgullosos de ti.","fotos":[{"src":"f1.webp","texto":"El primer día de clases"}]};</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, confeti, flotar, datos } = Regalo;

  if (datos.carrera) $('#carrera').textContent = datos.carrera;

  let lanzado = false;
  $('#birrete').addEventListener('click', async () => {
    if (lanzado) return;
    lanzado = true;
    if (navigator.vibrate) navigator.vibrate(30);
    $('#birrete').classList.add('lanzado');
    $('#instruccion').textContent = '¡Al cielo! ✦';
    await espera(450);
    confeti({ duracion: 5200, colores: ['#e2bd6c', '#f3d99c', '#ffffff', '#9fb3e8', '#1d2440'] });
    flotar(['✦', '✧', '★'], { cada: 700, duracion: 12000 });
    const nombre = datos.para ? `, ${datos.para}` : '';
    $('#titulo').textContent = datos.titulo || `¡Felicidades${nombre}!`;
    $('#instruccion').textContent = 'Todo tu esfuerzo valió la pena';
    await espera(1400);
    $('#contenido').hidden = false;
    $('#diploma').scrollIntoView({ behavior: 'smooth', block: 'center' });
    await espera(200);
    $('#diploma').classList.add('abierto');
    await espera(900);
    await escribir($('#mensaje'), datos.mensaje || 'Cada desvelo, cada examen y cada sacrificio te trajeron hasta aquí.\nEstoy muy orgulloso de ti.');
    if (datos.fotos && datos.fotos.length) {
      $('#tituloFotos').classList.add('rg-visible');
      $('#galeria').classList.add('rg-visible');
    }
  });

  Regalo.iniciar({});
  galeria($('#galeria'));
  if (!datos.fotos || !datos.fotos.length) $('#tituloFotos').remove();
</script>
</body>
</html>
