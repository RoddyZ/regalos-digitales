<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¡Felicidades, graduado!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<link rel="icon" href="../assets/icono.svg" type="image/svg+xml">
<style>
  :root {
    --rg-fondo: #dfe8fb;
    --rg-acento: #ffc23d;
    --rg-acento-2: #23366b;
    --rg-acento-tinta: #2c4a9a;
    --rg-caja: #23366b;
    --rg-cinta: #ffc23d;
    --rg-washi: rgba(255, 194, 61, 0.8);
    --azul: #23366b;
  }

  body {
    min-height: 100svh;
    background-image:
      linear-gradient(rgba(44, 74, 154, 0.07) 1.5px, transparent 1.5px),
      linear-gradient(90deg, rgba(44, 74, 154, 0.07) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
  }

  .rg-titulo { margin-inline: auto; }

  .carrera {
    display: inline-block;
    margin: 2px 0 0;
    padding: 6px 16px;
    background: var(--rg-acento);
    border: var(--rg-borde);
    border-radius: 999px;
    box-shadow: 0 3px 0 var(--rg-sombra);
    font-weight: 800;
    font-size: 0.92rem;
    transform: rotate(-1.5deg);
  }
  .carrera:empty { display: none; }

  .birrete {
    width: 220px;
    margin: 40px auto 26px;
    cursor: pointer;
    border: 0;
    background: none;
    padding: 0;
    animation: flotar-birrete 3s ease-in-out infinite;
  }
  .birrete svg { width: 100%; height: auto; display: block; overflow: visible; }
  .birrete .borla { transform-origin: 100px 52px; animation: balanceo 2.2s ease-in-out infinite; }
  .birrete.lanzado { animation: lanzar 1.5s cubic-bezier(0.25, 0.7, 0.3, 1) forwards; pointer-events: none; }

  @keyframes flotar-birrete { 50% { transform: translateY(-9px) rotate(-2deg); } }
  @keyframes balanceo { 50% { transform: rotate(7deg); } }
  @keyframes lanzar {
    0% { transform: none; }
    22% { transform: translateY(18px) scale(1.05, 0.92); }
    100% { transform: translateY(-120vh) rotate(540deg) scale(0.7); }
  }

  /* El diploma: papel que se desenrolla entre dos rodillos */
  .diploma {
    position: relative;
    margin: 10px 6px 0;
    transform-origin: 50% 0;
    transform: scaleY(0.04);
    opacity: 0;
    transition: transform 1s cubic-bezier(0.3, 1.2, 0.5, 1), opacity 0.3s ease;
  }
  .diploma.abierto { transform: none; opacity: 1; }

  .rollo {
    position: relative;
    z-index: 2;
    height: 26px;
    margin: 0 -12px;
    border: var(--rg-borde);
    border-radius: 13px;
    background: linear-gradient(#fffdf8 0 40%, #efe5cf 40%);
  }

  .papel {
    position: relative;
    margin: -13px 0;
    padding: 40px 26px 36px;
    background: #fffdf8;
    color: var(--rg-tinta);
    border: var(--rg-borde);
    border-top: 0;
    border-bottom: 0;
    box-shadow: 7px 0 0 var(--rg-sombra);
  }
  .papel::after {
    content: '';
    position: absolute;
    inset: 22px 12px;
    border: 2px dashed rgba(44, 74, 154, 0.35);
    border-radius: 6px;
    pointer-events: none;
  }

  .papel h2 {
    font-family: var(--rg-fuente-titulo);
    font-variation-settings: 'SOFT' 100, 'WONK' 1;
    font-weight: 650;
    font-size: 1.5rem;
    text-align: center;
    color: var(--rg-acento-tinta);
    margin: 0 0 16px;
  }

  .papel p {
    white-space: pre-line;
    line-height: 1.7;
    font-size: 1.1rem;
    margin: 0;
    min-height: 3.4em;
  }

  .roseta {
    position: absolute;
    left: 10px;
    bottom: -4px;
    width: 76px;
    z-index: 3;
    transform: rotate(-8deg);
  }

  .rg-subtitulo { margin-top: 72px; }
</style>
</head>
<body>
  <section class="rg-escena">
    <p class="rg-etiqueta">¡Lo lograste!</p>
    <h1 class="rg-titulo" id="titulo">Hoy celebramos tu esfuerzo</h1>
    <p class="carrera" id="carrera"></p>
    <button class="birrete" id="birrete" type="button" aria-label="Lanzar el birrete">
      <svg viewBox="0 0 200 150" aria-hidden="true">
        <g stroke="var(--rg-tinta)" stroke-width="3.5" stroke-linejoin="round">
          <path d="M52 66v36c0 18 96 18 96 0V66l-48 18z" fill="#1a2955"/>
          <polygon points="100,18 194,52 100,86 6,52" fill="var(--azul)"/>
        </g>
        <path d="M58 98c14 8 70 8 84 0" fill="none" stroke="#3b5296" stroke-width="3" stroke-linecap="round"/>
        <path d="M100 26L176 52" stroke="#3b5296" stroke-width="3" stroke-linecap="round"/>
        <g class="borla" stroke="var(--rg-tinta)" stroke-width="3" stroke-linejoin="round">
          <path d="M100 52Q142 54 160 64V104" fill="none" stroke="var(--rg-tinta)" stroke-width="7" stroke-linecap="round"/>
          <path d="M100 52Q142 54 160 64V104" fill="none" stroke="#ffc23d" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M152 102h16l4 26h-24z" fill="#ffc23d"/>
          <path d="M156 110v14M164 110v14" stroke-width="2"/>
        </g>
        <circle cx="100" cy="52" r="7" fill="#ffc23d" stroke="var(--rg-tinta)" stroke-width="3"/>
      </svg>
    </button>
    <p class="rg-ayuda" id="instruccion">Toca el birrete para lanzarlo al cielo</p>
  </section>

  <main class="rg-contenido" id="contenido" hidden>
    <div class="diploma" id="diploma">
      <div class="rollo"></div>
      <div class="papel">
        <h2>Con orgullo y admiración</h2>
        <p id="mensaje"></p>
        <div class="rg-firma">— <span data-campo="de"></span></div>
      </div>
      <div class="rollo"></div>
      <svg class="roseta" viewBox="0 0 80 100" aria-hidden="true">
        <g stroke="var(--rg-tinta)" stroke-width="3" stroke-linejoin="round">
          <path d="M28 52L18 96l12-8 8 12 6-46z" fill="#e0475b"/>
          <path d="M52 52l10 44-12-8-8 12-6-46z" fill="#e0475b"/>
          <path d="M40 4l7 6 9-2 3 9 9 3-2 9 6 7-6 7 2 9-9 3-3 9-9-2-7 6-7-6-9 2-3-9-9-3 2-9-6-7 6-7-2-9 9-3 3-9 9 2z" fill="#ffc23d"/>
          <circle cx="40" cy="38" r="15" fill="#ffd97a"/>
        </g>
        <path d="M40 29l3 6 6.5 1-4.7 4.6 1.1 6.4L40 44l-5.9 3 1.1-6.4L30.5 36l6.5-1z" fill="var(--rg-tinta)"/>
      </svg>
    </div>
    <h2 class="rg-subtitulo rg-oculto" id="tituloFotos">Momentos del camino</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = {"para":"Daniela","de":"Tu familia","carrera":"Ingeniería en Software · Promoción 2026","mensaje":"Cada desvelo, cada examen y cada sacrificio te trajeron hasta aquí.\nHoy celebramos a la profesional que siempre supimos que serías.\nEstamos muy orgullosos de ti.","fotos":[{"src":"f1.webp","texto":"El primer día de clases"}]};</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, confeti, flotar, final, datos } = Regalo;

  if (datos.carrera) $('#carrera').textContent = datos.carrera;

  let lanzado = false;
  $('#birrete').addEventListener('click', async () => {
    if (lanzado) return;
    lanzado = true;
    if (navigator.vibrate) navigator.vibrate(30);
    $('#birrete').classList.add('lanzado');
    $('#instruccion').textContent = '¡Al cielo!';
    await espera(450);
    confeti({ duracion: 5000, colores: ['#ffc23d', '#23366b', '#fffdf8', '#7ec4ff', '#e0475b'] });
    flotar([['estrella', '#ffc23d'], ['estrella', '#fffdf8']], { cada: 800, duracion: 12000 });
    $('#titulo').textContent = datos.titulo || (datos.para ? `¡Felicidades, ${datos.para}!` : '¡Felicidades!');
    $('#instruccion').textContent = 'Todo tu esfuerzo valió la pena';
    await espera(1300);
    $('#contenido').hidden = false;
    $('#diploma').scrollIntoView({ behavior: 'smooth', block: 'center' });
    await espera(200);
    $('#diploma').classList.add('abierto');
    await espera(900);
    await escribir($('#mensaje'), datos.mensaje || 'Cada desvelo, cada examen y cada sacrificio te trajeron hasta aquí.\nEstamos muy orgullosos de ti.');
    final();
  });

  Regalo.iniciar({});
  galeria($('#galeria'));
</script>
</body>
</html>
