<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¡Feliz Navidad!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<link rel="icon" href="../assets/icono.svg" type="image/svg+xml">
<style>
  :root {
    --rg-fondo: #1f5c45;
    --rg-texto: #fffdf8;
    --rg-texto-suave: rgba(255, 253, 248, 0.78);
    --rg-acento: #e5484d;
    --rg-acento-2: #ffd166;
    --rg-acento-tinta: #ffd166;
    --rg-boton-texto: #fffdf8;
    --rg-sombra: #133a2b;
    --rg-caja: #e5484d;
    --rg-cinta: #ffd166;
    --rg-washi: rgba(229, 72, 77, 0.75);
  }

  body { min-height: 100svh; }

  .nieve { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .nieve span { position: absolute; top: -30px; animation: caer linear forwards; }
  .nieve svg { width: 100%; height: auto; display: block; }
  @keyframes caer { to { transform: translate(var(--deriva), 112svh) rotate(160deg); } }

  .rg-titulo { margin-inline: auto; }

  .arbol { width: min(270px, 74vw); margin: 22px auto 14px; }
  .arbol svg { width: 100%; height: auto; display: block; overflow: visible; }

  .esfera { cursor: pointer; }
  .esfera .bola { fill: #174a37; transition: fill 0.3s ease; }
  .esfera.encendida { cursor: default; }
  .esfera.encendida .bola { fill: var(--c); }
  .esfera.encendida .brillo { opacity: 0.8; }
  .esfera .brillo { opacity: 0; transition: opacity 0.3s; }
  .esfera.encendida { animation: pop 0.4s cubic-bezier(0.3, 1.6, 0.5, 1); transform-box: fill-box; transform-origin: center; }
  @keyframes pop { 50% { transform: scale(1.35); } }

  .estrella { fill: #8a9a7f; transition: fill 0.5s ease; transform-box: fill-box; transform-origin: center; }
  .estrella.encendida { fill: #ffd166; animation: girar 2.6s ease-in-out infinite; }
  @keyframes girar { 50% { transform: scale(1.15) rotate(12deg); } }

  .rg-carta .rg-firma { color: #c8343a; }
  .rg-carta { color: var(--rg-tinta); }
</style>
</head>
<body>
  <div class="nieve" id="nieve" aria-hidden="true"></div>

  <section class="rg-escena">
    <p class="rg-etiqueta">Llegó la Navidad</p>
    <h1 class="rg-titulo" id="titulo">Un árbol por encender</h1>
    <p class="rg-ayuda" id="instruccion">Toca las esferas para encender el árbol</p>

    <div class="arbol">
      <svg viewBox="0 0 240 300" id="arbol" aria-label="Árbol de Navidad">
        <g stroke="var(--rg-tinta)" stroke-width="3.5" stroke-linejoin="round">
          <rect x="104" y="252" width="32" height="30" rx="3" fill="#8a5a35"/>
          <path d="M120 148L12 258h216z" fill="#3f9b5f"/>
          <path d="M120 92L28 206h184z" fill="#4cae6a"/>
          <path d="M120 40L44 144h152z" fill="#5cbf78"/>
          <rect x="22" y="262" width="46" height="34" rx="4" fill="#e5484d"/>
          <rect x="40" y="262" width="10" height="34" fill="#ffd166"/>
          <rect x="172" y="270" width="40" height="26" rx="4" fill="#7ec4ff"/>
          <rect x="187" y="270" width="10" height="26" fill="#fffdf8"/>
        </g>
        <path d="M70 120Q120 140 172 116M50 182Q120 206 190 176M30 240Q120 266 210 234" fill="none" stroke="#fffdf8" stroke-width="2.6" stroke-dasharray="1 9" stroke-linecap="round"/>
        <path class="estrella" id="estrella" d="M120 6l7.5 15.2 16.8 2.4-12.2 11.9 2.9 16.7L120 44.3l-15 7.9 2.9-16.7-12.2-11.9 16.8-2.4z" stroke="var(--rg-tinta)" stroke-width="3.2" stroke-linejoin="round"/>
      </svg>
    </div>
  </section>

  <main class="rg-contenido" id="contenido" hidden>
    <div class="rg-carta rg-oculto" id="carta">
      <p id="mensaje"></p>
      <div class="rg-firma">— <span data-campo="de"></span></div>
    </div>
    <h2 class="rg-subtitulo rg-oculto" id="tituloFotos">Recuerdos de este año</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = {"para":"Mamá","de":"Tus hijos","mensaje":"Gracias por llenar cada Navidad de risas, abrazos y el mejor pristiño del mundo.\nQue esta noche esté llena de paz y amor.\nTe amamos.","fotos":[{"src":"f1.webp"},{"src":"f2.webp","texto":"Navidad en familia"}]};</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, confeti, flotar, figura, final, datos } = Regalo;

  // Copos de nieve dibujados y bolitas
  const nieve = $('#nieve');
  setInterval(() => {
    const s = document.createElement('span');
    s.innerHTML = Math.random() < 0.4 ? figura('copo', '#fffdf8') : '<svg viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="#fffdf8"/></svg>';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.width = 6 + Math.random() * 14 + 'px';
    s.style.opacity = 0.5 + Math.random() * 0.5;
    s.style.setProperty('--deriva', (Math.random() - 0.5) * 80 + 'px');
    s.style.animationDuration = 8 + Math.random() * 6 + 's';
    nieve.appendChild(s);
    setTimeout(() => s.remove(), 14500);
  }, 320);

  // Esferas del árbol: apagadas hasta que las tocan
  const posiciones = [[98, 116], [146, 124], [74, 178], [124, 168], [172, 184], [58, 236], [112, 232], [164, 240], [196, 228]];
  const colores = ['#e5484d', '#ffd166', '#7ec4ff', '#fffdf8', '#e5484d', '#ffd166', '#c9a2ff', '#7ec4ff', '#ff9aad'];
  const svg = $('#arbol');
  const NS = 'http://www.w3.org/2000/svg';
  posiciones.forEach(([x, y], i) => {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'esfera');
    g.style.setProperty('--c', colores[i]);
    g.innerHTML = `<circle cx="${x}" cy="${y}" r="20" fill="transparent"/>
      <rect x="${x - 4}" y="${y - 15}" width="8" height="6" rx="1.5" fill="#c9b98f" stroke="var(--rg-tinta)" stroke-width="2"/>
      <circle class="bola" cx="${x}" cy="${y}" r="10" stroke="var(--rg-tinta)" stroke-width="3"/>
      <path class="brillo" d="M${x - 5} ${y - 2}a5 5 0 0 1 4-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`;
    g.addEventListener('click', () => encender(g));
    svg.insertBefore(g, $('#estrella'));
  });

  const total = posiciones.length;
  let encendidas = 0, celebrado = false;
  function encender(g) {
    if (g.classList.contains('encendida') || celebrado) return;
    g.classList.add('encendida');
    if (navigator.vibrate) navigator.vibrate(15);
    encendidas++;
    $('#instruccion').textContent = encendidas < total ? `${encendidas} de ${total} esferas encendidas` : '¡El árbol está listo!';
    if (encendidas === total) celebrar();
  }

  async function celebrar() {
    celebrado = true;
    await espera(400);
    $('#estrella').classList.add('encendida');
    confeti({ duracion: 4500, colores: ['#e5484d', '#ffd166', '#fffdf8', '#7ec4ff', '#5cbf78'] });
    flotar([['estrella', '#ffd166'], ['copo', '#fffdf8']], { cada: 900, duracion: 12000 });
    $('#titulo').textContent = datos.titulo || (datos.para ? `¡Feliz Navidad, ${datos.para}!` : '¡Feliz Navidad!');
    await espera(1800);
    $('#contenido').hidden = false;
    $('#carta').classList.add('rg-visible');
    $('#carta').scrollIntoView({ behavior: 'smooth', block: 'center' });
    await escribir($('#mensaje'), datos.mensaje || 'Que esta Navidad te llene de paz, amor y momentos bonitos.\nGracias por ser parte de mi año.');
    final();
  }

  Regalo.iniciar({});
  galeria($('#galeria'));
</script>
</body>
</html>
