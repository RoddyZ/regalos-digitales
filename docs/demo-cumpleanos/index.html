<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¡Feliz cumpleaños!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<link rel="icon" href="../assets/icono.svg" type="image/svg+xml">
<style>
  :root {
    --rg-fondo: #d9f0e4;
    --rg-acento: #ff9aad;
    --rg-acento-2: #ffd166;
    --rg-acento-tinta: #d6336c;
    --rg-caja: #ff9aad;
    --rg-cinta: #ffd166;
    --rg-washi: rgba(126, 196, 207, 0.8);
  }

  body { min-height: 100svh; }

  .banderines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    max-height: 90px;
    z-index: 3;
    pointer-events: none;
  }

  .rg-titulo { margin-inline: auto; }

  .pastel-zona {
    position: relative;
    width: 260px;
    height: 200px;
    margin: 92px auto 8px;
  }
  .pastel-zona svg { display: block; overflow: visible; }

  .velas {
    position: absolute;
    left: 60px;
    width: 140px;
    bottom: 160px;
    display: flex;
    justify-content: center;
    gap: 12px;
    z-index: 4;
  }

  .vela {
    position: relative;
    width: 14px;
    height: 46px;
    border: var(--rg-borde);
    border-bottom: 0;
    border-radius: 5px 5px 0 0;
    background: repeating-linear-gradient(-40deg, #fffdf8 0 6px, var(--color) 6px 12px);
    cursor: pointer;
    padding: 0;
  }
  .vela::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 100%;
    width: 2.5px;
    height: 7px;
    margin-left: -1.25px;
    background: var(--rg-tinta);
  }

  .llama {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 5px);
    width: 18px;
    height: 26px;
    margin-left: -9px;
    background: radial-gradient(circle at 50% 70%, #fff3b0 0 30%, #ffb703 32%);
    border: var(--rg-borde);
    border-radius: 50% 50% 50% 50% / 64% 64% 36% 36%;
    transform-origin: 50% 100%;
    animation: titilar 0.5s ease-in-out infinite alternate;
    transition: opacity 0.25s, transform 0.25s;
  }

  @keyframes titilar { to { transform: scaleY(1.12) rotate(4deg); } }

  .vela.apagada { cursor: default; }
  .vela.apagada .llama { opacity: 0; transform: scale(0.2); animation: none; }
  .vela.apagada::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: calc(100% + 6px);
    width: 14px;
    height: 14px;
    margin-left: -7px;
    border-radius: 50%;
    background: #fffdf8;
    border: 2px solid var(--rg-tinta);
    animation: humo 1.4s ease-out forwards;
  }
  @keyframes humo { to { transform: translate(6px, -46px) scale(1.8); opacity: 0; } }

  .acciones { margin-top: 30px; }

  .rg-carta { margin-top: 8px; }
</style>
</head>
<body>
  <svg class="banderines" viewBox="0 0 400 70" preserveAspectRatio="xMidYMin slice" aria-hidden="true" id="banderines"></svg>

  <section class="rg-escena">
    <p class="rg-etiqueta" id="etiqueta">Pide un deseo</p>
    <h1 class="rg-titulo" id="titulo">Hoy se celebra</h1>
    <p class="rg-ayuda" id="instruccion">Sopla las velas o tócalas una por una</p>

    <div class="pastel-zona" aria-label="Pastel de cumpleaños">
      <svg width="260" height="200" viewBox="0 0 260 200" id="pastel" aria-hidden="true"></svg>
      <div class="velas" id="velas"></div>
    </div>

    <div class="acciones">
      <button class="rg-boton rg-secundario" id="microfono" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4M8 22h8"/></svg>
        Soplar con el micrófono
      </button>
    </div>
  </section>

  <main class="rg-contenido" id="contenido" hidden>
    <div class="rg-carta rg-oculto" id="carta">
      <p id="mensaje"></p>
      <div class="rg-firma">— <span data-campo="de"></span></div>
    </div>
    <h2 class="rg-subtitulo rg-oculto" id="tituloFotos">Recuerdos bonitos</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = {"para":"Sofi","de":"Tu hermano","edad":7,"mensaje":"¡Feliz cumpleaños, peque!\nQue este año esté lleno de risas, juegos y muchos sueños cumplidos.\nTe amo un montón.","fotos":[{"src":"f1.webp"}]};</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, confeti, flotar, final, datos } = Regalo;
  const TINTA = 'stroke="var(--rg-tinta)" stroke-width="3" stroke-linejoin="round"';
  const COLORES = ['#ff9aad', '#ffd166', '#7ec4cf', '#b8a1e3', '#ff8a5b'];

  // Banderines de fiesta colgando de una cuerda curva.
  (function () {
    let html = `<path d="M-10 6 Q200 58 410 6" fill="none" ${TINTA}/>`;
    for (let i = 0; i < 11; i++) {
      const t = (i + 0.5) / 11, x = -10 + 420 * t, y = 6 + 2 * t * (1 - t) * 52;
      html += `<path d="M${x - 14} ${y - 1}L${x + 14} ${y - 1}L${x} ${y + 26}z" fill="${COLORES[i % COLORES.length]}" ${TINTA}/>`;
    }
    $('#banderines').innerHTML = html;
  })();

  // Pastel de dos pisos con glaseado chorreado y chispitas.
  (function () {
    const chorreado = (x, y, ancho, n) => {
      const paso = ancho / n;
      let d = `M${x} ${y}`;
      for (let i = 0; i < n; i++) {
        const largo = 10 + ((i * 7) % 4) * 4;
        d += ` q${paso / 4} ${largo} ${paso / 2} 0 q${paso / 4} -${largo * 0.4} ${paso / 2} 0`;
      }
      return `${d} V${y - 16} H${x} z`;
    };
    let chispas = '';
    [[42, 150], [70, 166], [104, 148], [150, 162], [186, 150], [214, 168], [92, 84], [128, 92], [166, 80]].forEach(([x, y], i) =>
      chispas += `<rect x="${x}" y="${y}" width="10" height="4" rx="2" fill="${COLORES[i % COLORES.length]}" stroke="var(--rg-tinta)" stroke-width="1.5" transform="rotate(${(i * 47) % 90 - 45} ${x + 5} ${y + 2})"/>`);
    $('#pastel').innerHTML = `
      <ellipse cx="130" cy="188" rx="126" ry="10" fill="#fffdf8" ${TINTA}/>
      <rect x="18" y="104" width="224" height="82" rx="14" fill="#ff9aad" ${TINTA}/>
      <path d="${chorreado(18, 122, 224, 7)}" fill="#fffdf8" ${TINTA}/>
      <rect x="18" y="104" width="224" height="20" rx="10" fill="#fffdf8"/>
      <rect x="60" y="40" width="140" height="68" rx="12" fill="#ffd6a5" ${TINTA}/>
      <path d="${chorreado(60, 56, 140, 5)}" fill="#ff9aad" ${TINTA}/>
      <rect x="61.5" y="41.5" width="137" height="16" rx="10" fill="#ff9aad"/>
      ${chispas}`;
  })();

  const edad = parseInt(datos.edad, 10);
  const nVelas = edad > 0 && edad <= 8 ? edad : 5;
  const velas = $('#velas');
  velas.style.gap = nVelas > 5 ? '6px' : '12px';
  for (let i = 0; i < nVelas; i++) {
    const v = document.createElement('button');
    v.type = 'button';
    v.className = 'vela';
    v.setAttribute('aria-label', 'Apagar vela');
    v.style.setProperty('--color', COLORES[i % COLORES.length]);
    v.innerHTML = '<span class="llama"></span>';
    v.addEventListener('click', () => apagar(v));
    velas.appendChild(v);
  }

  let celebrado = false;
  function apagar(v) {
    if (v.classList.contains('apagada')) return;
    v.classList.add('apagada');
    if (navigator.vibrate) navigator.vibrate(15);
    if (!celebrado && !velas.querySelector('.vela:not(.apagada)')) celebrar();
  }

  async function celebrar() {
    celebrado = true;
    detenerMicrofono();
    $('#microfono').hidden = true;
    $('#etiqueta').textContent = '¡Deseo pedido!';
    $('#titulo').textContent = datos.titulo || (datos.para ? `¡Feliz cumpleaños, ${datos.para}!` : '¡Feliz cumpleaños!');
    $('#instruccion').textContent = edad ? `Por tus ${edad} años, y por muchos más` : 'Que se cumpla todo lo que pediste';
    confeti({ duracion: 4800, colores: COLORES.concat('#fffdf8') });
    flotar([['estrella', '#ffd166'], ['circulo', '#7ec4cf'], ['corazon', '#ff9aad']], { cada: 800, duracion: 12000 });
    await espera(1800);
    $('#contenido').hidden = false;
    $('#carta').classList.add('rg-visible');
    $('#carta').scrollIntoView({ behavior: 'smooth', block: 'center' });
    await escribir($('#mensaje'), datos.mensaje || 'Que este nuevo año te traiga felicidad, salud y muchos motivos para sonreír.');
    final();
  }

  let flujo = null, ctxAudio = null;
  function detenerMicrofono() {
    flujo && flujo.getTracks().forEach(t => t.stop());
    ctxAudio && ctxAudio.close();
    flujo = ctxAudio = null;
  }

  $('#microfono').addEventListener('click', async () => {
    try {
      flujo = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      $('#instruccion').textContent = 'No hay micrófono: toca las velas una por una';
      $('#microfono').hidden = true;
      return;
    }
    $('#microfono').textContent = '¡Sopla fuerte hacia el celular!';
    ctxAudio = new AudioContext();
    const analizador = ctxAudio.createAnalyser();
    analizador.fftSize = 512;
    ctxAudio.createMediaStreamSource(flujo).connect(analizador);
    const buf = new Uint8Array(analizador.fftSize);
    let seguidos = 0;
    (function escuchar() {
      if (!flujo) return;
      analizador.getByteTimeDomainData(buf);
      let suma = 0;
      for (const b of buf) suma += (b - 128) ** 2;
      seguidos = Math.sqrt(suma / buf.length) > 28 ? seguidos + 1 : 0;
      if (seguidos > 6) {
        seguidos = 0;
        const encendida = velas.querySelector('.vela:not(.apagada)');
        encendida && apagar(encendida);
      }
      requestAnimationFrame(escuchar);
    })();
  });

  Regalo.iniciar({});
  galeria($('#galeria'));
</script>
</body>
</html>
