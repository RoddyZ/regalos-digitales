<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>¡Feliz cumpleaños!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/regalo.css">
<style>
  :root {
    --rg-fondo: #2b1640;
    --rg-texto: #fff4fb;
    --rg-acento: #ff7eb6;
    --rg-intro-fondo: radial-gradient(circle at 50% 35%, #5b2a7a, #1b0d29);
  }
  body { background: radial-gradient(circle at 50% 0%, #5b2a7a, #2b1640 55%, #1b0d29); min-height: 100svh; }

  .guirnalda { display: flex; justify-content: center; gap: 6px; padding-top: 14px; }
  .guirnalda span { width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid; transform-origin: top; animation: colgar 3s ease-in-out infinite; }
  .guirnalda span:nth-child(4n+1) { border-top-color: #ffd166; } .guirnalda span:nth-child(4n+2) { border-top-color: #ef476f; }
  .guirnalda span:nth-child(4n+3) { border-top-color: #06d6a0; } .guirnalda span:nth-child(4n)   { border-top-color: #4cc9f0; }
  @keyframes colgar { 50% { transform: rotate(6deg); } }

  .escena { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px 16px 40px; }
  h1 { font-family: var(--rg-fuente-titulo); font-size: clamp(2.3rem, 10vw, 3.8rem); margin: 0 0 4px; color: var(--rg-acento); }
  .instruccion { margin: 0 0 30px; opacity: .85; min-height: 1.5em; }

  /* Pastel hecho con CSS */
  .pastel { position: relative; width: 240px; margin-top: 60px; }
  .piso { position: relative; border-radius: 14px 14px 8px 8px; margin: 0 auto; }
  .piso.arriba { width: 170px; height: 70px; background: #ffb3d1; }
  .piso.abajo  { width: 240px; height: 90px; background: #ff85b3; margin-top: -4px; }
  .piso::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 22px; border-radius: 14px 14px 0 0;
    background: linear-gradient(#fff, #fff) top / 100% 12px no-repeat, radial-gradient(circle at 12px 2px, #fff 10px, transparent 11px) 0 0 / 24px 22px repeat-x; }
  .piso::after { content: ''; position: absolute; left: 10%; right: 10%; bottom: 18px; height: 8px; background: repeating-linear-gradient(90deg, #ffd166 0 8px, transparent 8px 16px); border-radius: 4px; }
  .plato { width: 280px; height: 14px; margin: -2px auto 0; background: #e9e4f0; border-radius: 50%; margin-left: -20px; }
  .velas { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); display: flex; gap: 16px; }
  .vela { position: relative; width: 12px; height: 46px; border-radius: 3px; background: repeating-linear-gradient(45deg, #fff 0 6px, #4cc9f0 6px 12px); cursor: pointer; }
  .llama { position: absolute; left: 50%; bottom: 100%; width: 14px; height: 24px; margin-left: -7px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 70%, #fff 0 20%, #ffd166 35%, #ff7b00 70%, transparent 72%);
    filter: drop-shadow(0 0 8px #ffb703); transform-origin: bottom; animation: titilar .35s ease-in-out infinite alternate; transition: opacity .4s, transform .4s; }
  .vela.apagada .llama { opacity: 0; transform: scale(.2) translateY(-10px); animation: none; }
  .vela.apagada::after { content: ''; position: absolute; left: 50%; bottom: 100%; width: 3px; height: 30px; margin-left: -1px; background: linear-gradient(transparent, rgba(255,255,255,.5)); animation: humo 1.4s ease-out forwards; }
  @keyframes titilar { from { transform: scaleY(1) skewX(-2deg); } to { transform: scaleY(1.12) skewX(3deg); } }
  @keyframes humo { to { transform: translateY(-40px) scaleX(4); opacity: 0; } }

  .boton { margin-top: 34px; font: 600 1rem var(--rg-fuente); color: var(--rg-texto); background: transparent; border: 2px solid var(--rg-acento); border-radius: 999px; padding: 12px 22px; }
  .boton[hidden] { display: none; }

  .contenido { position: relative; z-index: 2; max-width: 620px; margin: 0 auto; padding: 0 16px 80px; }
  .carta { background: #fff4fb; color: #3a2146; border-radius: 18px; padding: 26px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  .carta p { white-space: pre-line; line-height: 1.7; font-size: 1.08rem; margin: 0; min-height: 3em; }
  .contenido h2 { font-family: var(--rg-fuente-titulo); font-size: 2rem; text-align: center; color: var(--rg-acento); margin: 48px 0 8px; }
</style>
</head>
<body data-icono="🎂">
  <div class="guirnalda" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <section class="escena">
    <h1 id="titulo">Pide un deseo…</h1>
    <p class="instruccion" id="instruccion">y sopla las velas (o tócalas)</p>
    <div class="pastel" aria-label="Pastel de cumpleaños">
      <div class="piso arriba"><div class="velas" id="velas"></div></div>
      <div class="piso abajo"></div>
      <div class="plato"></div>
    </div>
    <button class="boton" id="microfono" type="button">🎤 Soplar con el micrófono</button>
  </section>

  <main class="contenido" id="contenido" hidden>
    <div class="carta rg-oculto" id="carta">
      <p id="mensaje"></p>
      <div class="rg-firma">— <span data-campo="de"></span></div>
    </div>
    <h2 class="rg-oculto" id="tituloFotos">Recuerdos</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = {"para":"Sofi","de":"Tu hermano","edad":7,"mensaje":"¡Feliz cumpleaños, peque!\nQue este año esté lleno de risas, juegos y muchos sueños cumplidos.\nTe amo un montón.","fotos":[{"src":"f1.webp"}]};</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, confeti, flotar, datos } = Regalo;

  // Número de velas: la edad si es corta (hasta 9), si no 5 velas.
  const edad = parseInt(datos.edad, 10);
  const nVelas = edad > 0 && edad <= 9 ? edad : 5;
  const velas = $('#velas');
  for (let i = 0; i < nVelas; i++) {
    const v = document.createElement('div');
    v.className = 'vela';
    v.innerHTML = '<div class="llama"></div>';
    v.addEventListener('click', () => apagar(v));
    velas.appendChild(v);
  }

  let celebrado = false;
  function apagar(v) {
    v.classList.add('apagada');
    if (!celebrado && !velas.querySelector('.vela:not(.apagada)')) celebrar();
  }

  async function celebrar() {
    celebrado = true;
    detenerMicrofono();
    $('#microfono').hidden = true;
    const nombre = datos.para ? `, ${datos.para}` : '';
    $('#titulo').textContent = datos.titulo || `¡Feliz cumpleaños${nombre}!`;
    $('#instruccion').textContent = edad ? `¡${edad} años increíbles! 🎉` : '¡Que se cumpla tu deseo! 🎉';
    confeti({ duracion: 5000 });
    flotar(['🎈', '✨', '🎉'], { cada: 700, duracion: 12000 });
    await espera(1800);
    $('#contenido').hidden = false;
    $('#carta').classList.add('rg-visible');
    $('#carta').scrollIntoView({ behavior: 'smooth', block: 'center' });
    await escribir($('#mensaje'), datos.mensaje || 'Que este nuevo año te traiga todo lo que mereces.');
    if (datos.fotos && datos.fotos.length) { $('#tituloFotos').classList.add('rg-visible'); $('#galeria').classList.add('rg-visible'); }
  }

  // Detección de soplido: volumen sostenido alto en el micrófono.
  let flujo = null, ctxAudio = null;
  function detenerMicrofono() { flujo && flujo.getTracks().forEach(t => t.stop()); ctxAudio && ctxAudio.close(); flujo = ctxAudio = null; }
  $('#microfono').addEventListener('click', async () => {
    try {
      flujo = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch {
      $('#instruccion').textContent = 'No se pudo usar el micrófono: toca las velas 😉';
      $('#microfono').hidden = true;
      return;
    }
    $('#microfono').textContent = '💨 ¡Sopla fuerte!';
    ctxAudio = new AudioContext();
    const analizador = ctxAudio.createAnalyser();
    analizador.fftSize = 512;
    ctxAudio.createMediaStreamSource(flujo).connect(analizador);
    const buf = new Uint8Array(analizador.fftSize);
    let seguidos = 0;
    (function escuchar() {
      if (!flujo) return;
      analizador.getByteTimeDomainData(buf);
      let suma = 0;
      for (const b of buf) suma += (b - 128) ** 2;
      const volumen = Math.sqrt(suma / buf.length);
      seguidos = volumen > 28 ? seguidos + 1 : 0;
      if (seguidos > 6) {
        seguidos = 0;
        const encendida = velas.querySelector('.vela:not(.apagada)');
        encendida && apagar(encendida);
      }
      requestAnimationFrame(escuchar);
    })();
  });

  Regalo.iniciar({});
  galeria($('#galeria'));
  if (!datos.fotos || !datos.fotos.length) $('#tituloFotos').remove();
</script>
</body>
</html>
