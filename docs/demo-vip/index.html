<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Flores amarillas para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/regalo.css">
<style>
  :root {
    --rg-fondo: #090e18;
    --rg-texto: #fefcf7;
    --rg-acento: #f5b738;
    --rg-acento-luz: #fce38a;
    --rg-verde-tallo: #386641;
    --rg-verde-hoja: #4b8056;
    --rg-intro-fondo: radial-gradient(circle at 50% 35%, #18253d, #060911);
  }

  body {
    background: radial-gradient(circle at 50% 10%, #162238 0%, #0b111e 65%, #05070c 100%);
    min-height: 100svh;
  }

  .cielo {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .estrella {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #ffffff;
    border-radius: 50%;
    animation: brillar 3.5s ease-in-out infinite;
  }

  .luciernaga {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff6a6;
    box-shadow: 0 0 12px 3px rgba(245, 183, 56, 0.7);
    animation: volar 10s ease-in-out infinite alternate;
    opacity: 0;
  }

  @keyframes brillar {
    0%, 100% { opacity: 0.15; transform: scale(0.8); }
    50% { opacity: 0.85; transform: scale(1.2); }
  }

  @keyframes volar {
    0% { opacity: 0; transform: translate(0, 0); }
    25% { opacity: 0.9; }
    100% { opacity: 0.2; transform: translate(70px, -90px); }
  }

  .escena {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    z-index: 2;
  }

  .cabecera {
    text-align: center;
    padding: 10vh 20px 0;
    z-index: 3;
  }

  .dedicatoria-caligrafica {
    font-family: var(--rg-fuente-acento);
    font-size: 2.2rem;
    color: var(--rg-acento);
    margin: 0 0 4px;
    line-height: 1;
  }

  .cabecera h1 {
    font-family: var(--rg-fuente-titulo);
    font-weight: 500;
    font-size: clamp(2.3rem, 8vw, 3.8rem);
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--rg-texto);
    line-height: 1.15;
    text-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }

  #jardin {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 72svh;
    width: 100%;
    z-index: 2;
  }

  .tallo {
    fill: none;
    stroke: var(--rg-verde-tallo);
    stroke-width: 4.5;
    stroke-linecap: round;
  }

  .hoja {
    fill: var(--rg-verde-hoja);
    transform: scale(0);
    transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .flor {
    transform-box: fill-box;
    transform-origin: center;
    transform: scale(0) rotate(-70deg);
    transition: transform 1.5s cubic-bezier(0.2, 1.3, 0.4, 1);
    filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
  }

  .crecida .hoja { transform: scale(1); }
  .crecida .flor { transform: scale(1) rotate(0); }
  .flor .centro { fill: #5c3510; }
  .flor.abierta { animation: mecer 6s ease-in-out infinite; }

  @keyframes mecer {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(5deg); }
  }

  .bajar {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--rg-acento-luz);
    opacity: 0;
    transition: opacity 1s;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .bajar.rg-visible {
    opacity: 0.85;
    animation: rebote 2.2s infinite ease-in-out;
  }

  @keyframes rebote {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 8px); }
  }

  .contenido {
    position: relative;
    z-index: 3;
    max-width: 620px;
    margin: 0 auto;
    padding: 48px 20px 90px;
  }

  .carta {
    background: rgba(14, 21, 35, 0.72);
    border: 1px solid rgba(245, 183, 56, 0.28);
    border-radius: 16px;
    padding: 38px 30px;
    backdrop-filter: blur(14px);
    box-shadow: 0 24px 60px -15px rgba(0, 0, 0, 0.75);
    color: #fbf7ee;
  }

  .carta p {
    white-space: pre-line;
    line-height: 1.8;
    font-size: 1.08rem;
    margin: 0;
    min-height: 3.5em;
  }

  .carta .rg-firma {
    color: var(--rg-acento);
  }

  .contenido h2 {
    font-family: var(--rg-fuente-titulo);
    font-size: 2.1rem;
    text-align: center;
    color: var(--rg-acento-luz);
    margin: 54px 0 12px;
    letter-spacing: -0.02em;
  }
</style>
</head>
<body data-icono="🌻">
  <div class="cielo" id="cielo"></div>

  <section class="escena">
    <header class="cabecera rg-oculto" id="cabecera">
      <p class="dedicatoria-caligrafica">Para ti</p>
      <h1 data-campo="titulo">Flores amarillas para ti</h1>
    </header>

    <svg id="jardin" viewBox="0 0 400 520" preserveAspectRatio="xMidYMax meet" aria-hidden="true"></svg>

    <div class="bajar" id="bajar">
      <span>Desliza hacia abajo</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </div>
  </section>

  <main class="contenido">
    <div class="carta rg-oculto" id="carta">
      <p id="mensaje"></p>
      <div class="rg-firma">— <span data-campo="de"></span></div>
    </div>
    <h2 class="rg-oculto" id="tituloFotos">Nuestros momentos</h2>
    <div id="galeria" class="rg-oculto"></div>
  </main>

<script>window.REGALO = {"para":"María","de":"Andrés","titulo":"Flores amarillas para ti","pregunta":"¿Qué flores te regalo hoy? (pista para la demo: amarillas)","pista":"Son del color del sol ☀️","mensaje":"Solo tú sabías la respuesta.\nY solo tú haces que mis días sean amarillos, como el sol.","fotos":[{"src":"f1.webp"},{"src":"f2.webp"},{"src":"f3.webp"}],"respuestas":["5a77a37cf376be6086946c798b318fd9f2504df351172cb211b18810826d8d32","32e0c32bb1539eb15650ccd31328d025fe78ed8c2b8522e99b243b9f80417e97"]};</script>
<script src="../assets/regalo.js"></script>
<script>
  const { $, espera, escribir, galeria, flotar, datos } = Regalo;

  const cielo = $('#cielo');
  for (let i = 0; i < 75; i++) {
    const e = document.createElement('div');
    e.className = 'estrella';
    Object.assign(e.style, {
      left: Math.random() * 100 + '%',
      top: Math.random() * 65 + '%',
      animationDelay: Math.random() * 3.5 + 's'
    });
    cielo.appendChild(e);
  }
  for (let i = 0; i < 15; i++) {
    const l = document.createElement('div');
    l.className = 'luciernaga';
    Object.assign(l.style, {
      left: Math.random() * 95 + '%',
      top: 40 + Math.random() * 55 + '%',
      animationDelay: Math.random() * 9 + 's',
      animationDuration: 7 + Math.random() * 6 + 's'
    });
    cielo.appendChild(l);
  }

  const NS = 'http://www.w3.org/2000/svg';
  const svg = $('#jardin');
  const el = (tag, attrs, padre) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    padre && padre.appendChild(n);
    return n;
  };
  const defs = el('defs', {}, svg);
  const grad = el('radialGradient', { id: 'petalo', cx: '50%', cy: '100%', r: '100%' }, defs);
  el('stop', { offset: '0%', 'stop-color': '#e69516' }, grad);
  el('stop', { offset: '100%', 'stop-color': '#fce38a' }, grad);

  const flores = [];
  const posiciones = [40, 95, 150, 200, 250, 305, 360, 120, 280, 70, 330];
  posiciones.forEach((x, i) => {
    const alto = 190 + Math.random() * 230;
    const topeY = 520 - alto;
    const curva = x + (Math.random() - 0.5) * 50;
    const g = el('g', {}, svg);
    const tallo = el('path', { class: 'tallo', d: `M${x} 520 Q${curva} ${520 - alto/2} ${x} ${topeY}` }, g);
    const lado = i % 2 ? 1 : -1;
    const hy = 520 - alto * (0.3 + Math.random() * 0.2);
    el('path', { class: 'hoja', d: `M${x} ${hy} q${18*lado} -14 ${30*lado} -4 q${-14*lado} 12 ${-30*lado} 4z`, style: `transform-origin:${x}px ${hy}px` }, g);
    const flor = el('g', { class: 'flor' }, g);
    const radio = 14 + Math.random() * 10;
    for (let capa = 0; capa < 2; capa++) {
      const n = 14;
      for (let p = 0; p < n; p++) {
        const ang = (360 / n) * p + capa * (180 / n);
        el('ellipse', { cx: x, cy: topeY - radio * (capa ? 0.45 : 0.62), rx: radio * 0.28, ry: radio * (capa ? 0.45 : 0.62), fill: 'url(#petalo)', transform: `rotate(${ang} ${x} ${topeY})`, opacity: capa ? 1 : 0.92 }, flor);
      }
    }
    el('circle', { class: 'centro', cx: x, cy: topeY, r: radio * 0.32 }, flor);
    const largo = tallo.getTotalLength();
    tallo.style.strokeDasharray = largo;
    tallo.style.strokeDashoffset = largo;
    tallo.style.transition = 'stroke-dashoffset 2.2s ease-out';
    flores.push({ g, tallo, flor, orden: Math.random() });
  });

  function mostrar(elem) { elem && elem.classList.add('rg-visible'); }

  Regalo.iniciar({
    async alAbrir() {
      await espera(400);
      mostrar($('#cabecera'));
      flores.sort((a, b) => a.orden - b.orden);
      flores.forEach((f, i) => setTimeout(() => {
        f.tallo.style.strokeDashoffset = 0;
        setTimeout(() => {
          f.g.classList.add('crecida');
          setTimeout(() => f.flor.classList.add('abierta'), 1500);
        }, 1900);
      }, i * 260));
      await espera(4200);
      mostrar($('#bajar'));
      flotar(['✿', '❀', '✧'], { cada: 900 });

      const obs = new IntersectionObserver(async ([e]) => {
        if (!e.isIntersecting) return;
        obs.disconnect();
        mostrar($('#carta'));
        await escribir($('#mensaje'), datos.mensaje || 'Porque hay personas que hacen florecer todo a su alrededor.');
        if (datos.fotos && datos.fotos.length) {
          mostrar($('#tituloFotos'));
          mostrar($('#galeria'));
        }
      }, { threshold: 0.25 });
      obs.observe($('#carta'));
    }
  });

  galeria($('#galeria'));
  if (!datos.fotos || !datos.fotos.length) $('#tituloFotos').remove();
</script>
</body>
</html>
